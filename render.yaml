# Backend da Farol FM no Render (render.com) — publicado pelo botão "Deploy to Render" do README.
# Plano Starter (sempre ligado) + disco persistente de 1 GB para o banco de dados.
services:
  - type: web
    name: farol-api
    runtime: node
    rootDir: server
    plan: starter
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/bootstrap
    autoDeploy: true
    disk:
      name: farol-dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_FILE
        value: /var/data/farol.db
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_ORIGIN
        value: https://farolradiotv.com.br,https://www.farolradiotv.com.br
      - key: SITE_URL
        value: https://farolradiotv.com.br
      - key: PUBLIC_URL
        value: https://api.farolradiotv.com.br
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
