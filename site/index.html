function admPublicidade(){const as=S.data.anuncios||[];const tv=as.reduce((t,a)=>t+(+a.views||0),0),tc=as.reduce((t,a)=>t+(+a.clicks||0),0);
 return`<div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 style="margin:0">Publicidade</h2><button class="btn" onclick="admEdit('anuncios')">+ Novo anúncio</button></div>
 <div class="kpis" style="margin-top:14px"><div class="card kpi"><span>Anúncios no ar</span><b>${as.filter(a=>a.ativo&&inRange(a.inicio,a.fim)).length}</b></div><div class="card kpi"><span>Visualizações</span><b>${tv.toLocaleString('pt-BR')}</b></div><div class="card kpi"><span>Cliques</span><b>${tc.toLocaleString('pt-BR')}</b></div><div class="card kpi"><span>CTR médio</span><b>${tv?(tc/tv*100).toFixed(2):'0.00'}%</b></div></div>
 <h3 style="margin:22px 0 0">Mapa de espaços</h3><div class="adm-slots">${Object.entries(SLOTS).map(([k,[n,d]])=>{const n2=adAtivos(k).length;return`<div class="adm-slot"><b>${n}</b><span>${d}</span><div class="small ${n2?'ok':'vz'}">${n2?`${n2} anúncio(s) em rodízio`:adsenseSlot(k)?'Google AdSense':'Livre — mostra “Anuncie aqui”'}</div><button class="btn ghost sm" style="margin-top:6px" onclick="S.adNovo='${k}';admEdit('anuncios')">+ Anunciar aqui</button></div>`}).join('')}</div>
 <h3 style="margin-bottom:10px">Anúncios</h3><div class="card tblwrap"><table class="t"><thead><tr><th>Banner</th><th>Anunciante</th><th>Espaço</th><th>Período</th><th>Views</th><th>Cliques</th><th>CTR</th><th>Status</th><th></th></tr></thead><tbody>${as.map(a=>{const d=SLOTS[a.posicao]?SLOTS[a.posicao][2]:[300,250];const st=!a.ativo?['Pausado','']:!inRange(a.inicio,a.fim)?(a.inicio&&Date.parse(a.inicio)>Date.now()?['Agendado','info']:['Encerrado','']):['No ar','ok'];
  return`<tr><td><img src="${a.imagem||adSvg(a,d[0],d[1])}" style="width:120px;height:auto;max-height:60px;object-fit:contain;border-radius:4px"></td><td><b>${esc(a.anunciante)}</b><div class="small muted">${esc(a.titulo||'')}</div></td><td class="small">${esc((SLOTS[a.posicao]||['?'])[0])}</td><td class="small">${a.inicio?fdate(a.inicio):'—'} → ${a.fim?fdate(a.fim):'—'}</td><td>${(+a.views||0).toLocaleString('pt-BR')}</td><td>${(+a.clicks||0).toLocaleString('pt-BR')}</td><td>${a.views?((a.clicks||0)/a.views*100).toFixed(2):'0.00'}%</td><td><span class="badge ${st[1]}">${st[0]}</span></td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="admEdit('anuncios','${a.id}')">Editar</button> <button class="btn ghost sm" onclick="adRelatorio('${a.id}')">📄</button> <button class="btn ghost sm" onclick="admDel('anuncios','${a.id}')">🗑</button></td></tr>`}).join('')||'<tr><td colspan="9" class="muted">Nenhum anúncio.</td></tr>'}</tbody></table></div>
 <h3 style="margin-top:24px">Configurações</h3>${setForm('',SETF.publicidade=[{k:'adOculto',l:'<b>Ocultar toda a publicidade do site</b> (nenhum espaço aparece para os visitantes)',type:'checkbox',w:'full'},...Object.entries(SLOTS).map(([k,[n]])=>({k:'adOff_'+k,l:'Ocultar o espaço: '+n,type:'checkbox',w:'w2'})),{k:'anuncieAqui',l:'Mostrar “Anuncie aqui” nos espaços vazios',type:'checkbox',w:'w3'},{k:'adMobile',l:'Ativar faixa fixa no celular (320×50)',type:'checkbox',w:'w3'},{k:'adsenseClient',l:'Google AdSense — ID do editor (ca-pub-...) — opcional',w:'w3'},{k:'adsenseSlots',l:'AdSense por espaço (um por linha: espaço=ID do bloco). Ex.: lateral2=1234567890',type:'textarea',rows:3,w:'w3'}]).replace('<h2></h2>','')}
 <p class="small muted">Espaços disponíveis para o AdSense: ${Object.keys(SLOTS).join(', ')}. Os anúncios diretos (cadastrados acima) têm prioridade; o AdSense entra só nos espaços sem anúncio direto.</p>`}
function adRelatorio(id){const a=S.data.anuncios.find(x=>x.id===id);const ctr=a.views?((a.clicks||0)/a.views*100).toFixed(2):'0.00';const txt=`Relatório de veiculação — Farol FM\nAnunciante: ${a.anunciante}\nEspaço: ${(SLOTS[a.posicao]||[''])[0]} (${(SLOTS[a.posicao]||['',''])[1]})\nPeríodo: ${a.inicio?fdate(a.inicio):'início'} a ${a.fim?fdate(a.fim):'em aberto'}\nVisualizações: ${(+a.views||0).toLocaleString('pt-BR')}\nCliques: ${(+a.clicks||0).toLocaleString('pt-BR')}\nCTR: ${ctr}%\nGerado em ${fdt(new Date())}`;
 openModal(`<h3>Relatório para o anunciante</h3><textarea style="width:100%;height:200px;font-family:monospace;font-size:13px" readonly>${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="copyTxt(this.parentNode.previousElementSibling.value)">${ic('copy')} Copiar</button><a class="btn ghost" style="background:#25D366;color:#fff" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${ic('wa')} Enviar no WhatsApp</a></div>`)}

/* ===================== AGENTE DE ATENDIMENTO (robô → vendedor) ===================== */
const W={open:false,typing:false,unread:0,tip:true};let WC=null;
const MENU=[['loja','🛍️ Comprar na loja'],['pedido','📦 Meu pedido'],['musica','🎶 Pedir música'],['oracao','🙏 Pedido de oração'],['anunciar','📢 Anunciar na Farol'],['humano','👤 Falar com vendedor']];
const SETORES={vendas:'vendas',comercial:'comercial (anúncios)',estudio:'estúdio'};
function wcLoad(){const r=LS.get('fr_conv',null);if(!r)return null;if(!CFG.API)return S.data.conversas.find(x=>x.id===r.id)||null;return r.id?r:null}
function wcNew(){WC={id:'site'+uid(),k:uid()+uid(),canal:'site',nome:LS.get('fr_cli',{}).nome||'',contato:LS.get('fr_cli',{}).tel||'',modo:'bot',estado:'menu',setor:'',msgs:[],criado:new Date().toISOString(),atualizado:new Date().toISOString()};return WC}
async function wcSave(nm=[]){WC.atualizado=new Date().toISOString();
 if(!CFG.API){const a=S.data.conversas;const i=a.findIndex(x=>x.id===WC.id);i<0?a.unshift(WC):a[i]=WC;DB.persist('conversas');LS.set('fr_conv',{id:WC.id});return}
 LS.set('fr_conv',WC);try{const j=await api('POST','/api/chat/'+WC.id,{k:WC.k,nome:WC.nome,contato:WC.contato,modo:WC.modo,setor:WC.setor,motivo:WC.motivo,protocolo:WC.protocolo,msgs:nm});WC={...j,k:WC.k,estado:WC.estado,tmp:WC.tmp};LS.set('fr_conv',WC)}catch(e){}}
const wPush=m=>{m.d=new Date().toISOString();WC.msgs.push(m);return m};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function botSay(txt,extra={}){W.typing=true;renderWAbody();await sleep(420+Math.min(900,txt.length*7));W.typing=false;const m=wPush({de:'bot',txt,...extra});await wcSave([m]);renderWAbody()}
const intent=t=>{t=slug(t);if(/atendente|humano|vendedor|pessoa|falarcom|consultor|gerente/.test(t))return'humano';if(/pedido|entrega|rastre|comprei|statusd|chegou/.test(t))return'pedido';if(/comprar|loja|produto|preco|camis|biblia|livro|oferta|promo|caneca|bone|quanto/.test(t))return'loja';if(/musica|louvor|tocar|cantor|hino/.test(t))return'musica';if(/oracao|orar|oremos|ore|prece/.test(t))return'oracao';if(/anunci|propaganda|patrocin|comercial|publicidade/.test(t))return'anunciar';if(/^(oi|ola|opa|bomdia|boatarde|boanoite|menu|inicio|comecar|eai|paz)/.test(t))return'menu';return''};
const nomeCurto=()=>WC.nome?WC.nome.split(' ')[0]:'';
async function botMenu(pre){WC.estado='menu';await botSay(pre||`Olá${nomeCurto()?', '+nomeCurto():''}! 👋 Eu sou o *${ST().botNome}*, assistente virtual da Farol FM.\nComo posso te ajudar hoje?`,{op:MENU})}
async function waInput(v,label,silent){if(!WC)wcNew();if(!silent){const um=wPush({de:'cliente',txt:label||v});await wcSave([um]);renderWAbody()}
 if((WC.modo==='fila'||WC.modo==='humano')&&!label)return; // texto livre vai para o atendente
 const t=String(v).trim();const st=WC.estado;
 if(v==='menu')return botMenu('Claro! Em que mais posso ajudar? 😊');
 if(v==='voltarbot'){WC.modo='bot';await wcSave();return botMenu('Tudo bem! Voltei a te atender por aqui. 🤖')}
 if(v==='loja')return(WC.estado='loja',botSay('Que bom! 😍 O que você procura? Escolha uma categoria:',{op:[['ofertas','🔥 Ofertas da semana'],...catsLoja().map(c=>['cat:'+c,c]),['menu','⬅️ Menu']]}));
 if(v==='ofertas'||v.startsWith('cat:')){const ps=S.data.produtos.filter(p=>p.ativo&&+p.estoque>0&&(v==='ofertas'?offPct(p)>0||p.destaque:p.categoria===v.slice(4))).slice(0,8);
  return botSay(ps.length?`Separei ${ps.length} opção(ões) pra você 👇\nToque em *Quero* para adicionar ao carrinho.${ST().pixDesconto?`\n💚 No PIX tem ${ST().pixDesconto}% de desconto!`:''}`:'Ops, não temos itens disponíveis aí agora. 😕',{prods:ps.map(p=>p.id),op:[['loja','🔎 Outras categorias'],['carrinho','🛒 Ver carrinho'],['humano','👤 Falar com vendedor']]})}
 if(v.startsWith('buy:')){const p=S.data.produtos.find(x=>x.id===v.slice(4));if(!p)return botMenu();if(varsOf(p).length)return botSay(`Qual opção de *${p.nome}* você quer?`,{op:varsOf(p).map(o=>['bv:'+p.id+':'+o,o])});addCart(p.id,1);return botAdded(p)}
 if(v.startsWith('bv:')){const[,id,o]=v.split(':');const p=S.data.produtos.find(x=>x.id===id);addCart(id,1,o);return botAdded(p,o)}
 if(v==='carrinho'||v==='checkout'){location.hash=v;return botSay(v==='checkout'?`Abri o pagamento pra você! 💳 PIX com ${ST().pixDesconto||0}% off ou cartão em até ${ST().parcelasMax}x. Qualquer dúvida, é só chamar.`:'Abri seu carrinho. 🛒',{op:[['humano','👤 Ajuda de um vendedor'],['menu','Menu']]})}
 if(v==='pedido')return(WC.estado='pedido',botSay('Me diga o *número do pedido* (ex.: FF12345678) 📦'));
 if(v==='musica')return(WC.estado='musica',botSay('🎶 Qual música e cantor você quer ouvir? Mande também seu nome, cidade e um recado!'));
 if(v==='oracao')return(WC.estado='oracao',botSay('🙏 Escreva seu pedido de oração. Nossa equipe vai orar por você com carinho.'));
 if(v==='ouvir'){if(!S.playing)togglePlay();return botSay('Tocando a Farol FM pra você! 📻',{op:[['menu','Menu']]})}
 if(v==='anunciar'){WC.setor='comercial';return humano()}
 if(v==='humano'){WC.setor=WC.setor&&WC.setor!=='comercial'?WC.setor:'vendas';return humano()}
 if(v==='semtel'){WC.contato='';WC.semtel=true;WC.estado='h_motivo';return botSay('Sem problemas! Em poucas palavras, *o que você precisa?*')}
 // texto livre por etapa
 if(st==='pedido'||st==='pedido_email')return botPedido(t);
 if(st==='musica'){const o={nome:WC.nome||'Ouvinte do site',texto:t,origem:'site',data:new Date().toISOString(),lido:false};try{if(CFG.API)await api('POST','/api/musicas',o);else await DB.save('musicas',o)}catch(e){}WC.estado='menu';return botSay('Anotado! 📻 Seu pedido já está no estúdio da Farol FM. Fique ligado na programação!',{op:[['ouvir','▶️ Ouvir agora'],['menu','Menu']]})}
 if(st==='oracao'){const o={nome:WC.nome||'Visitante',cidade:'',texto:t,noAr:false,data:new Date().toISOString(),lido:false};try{if(CFG.API)await api('POST','/api/oracoes',o);else await DB.save('oracoes',o)}catch(e){}WC.estado='menu';return botSay('Recebemos seu pedido. 🙏 “Entrega o teu caminho ao Senhor; confia nele.” Estamos orando por você!',{op:[['menu','Menu']]})}
 if(st==='h_nome'){WC.nome=t.slice(0,60);if(WC.contato||WC.semtel){WC.estado='h_motivo';await wcSave();return botSay(`Prazer, ${nomeCurto()}! 😊 Em poucas palavras, *o que você precisa?*`)}WC.estado='h_tel';await wcSave();return botSay(`Prazer, ${nomeCurto()}! 😊 Qual seu *WhatsApp com DDD*? Assim o vendedor também pode te chamar por lá.`,{op:[['semtel','Prefiro falar só por aqui']]})}
 if(st==='h_tel'){const d=t.replace(/\D/g,'');if(d.length<10)return botSay('Hmm, esse número parece incompleto. Pode mandar com DDD? (ex.: 82 99999-9999)',{op:[['semtel','Prefiro falar só por aqui']]});WC.contato=d;WC.estado='h_motivo';await wcSave();return botSay('Anotado! ✅ Em poucas palavras, *o que você precisa?* (ex.: comprar 3 camisetas G, dúvida sobre entrega…)')}
 if(st==='h_motivo'){WC.motivo=t.slice(0,300);return handoff()}
 const it=intent(t);if(it)return waInput(it,it,true);
 if(CFG.API){try{W.typing=true;renderWAbody();const j=await api('POST','/api/chat/'+WC.id+'/ia',{k:WC.k,texto:t});W.typing=false;if(j&&j.resposta){WC={...j.conv,k:WC.k,estado:WC.estado};LS.set('fr_conv',WC);renderWAbody();if(j.humano){WC.setor='vendas';return humano()}return}}catch(e){W.typing=false}}
 return botSay('Desculpe, não entendi muito bem. 😅 Escolha uma das opções ou digite *atendente* para falar com uma pessoa:',{op:MENU})}
async function botAdded(p,o){const t=totals();return botSay(`✅ *${p.nome}*${o?' ('+o+')':''} está no seu carrinho!\nSubtotal: *${brl(t.sub)}* · ${t.count} item(ns).`,{op:[['checkout','💳 Finalizar compra'],['loja','➕ Continuar comprando'],['humano','👤 Dúvida com vendedor']]})}
async function botPedido(t){if(WC.estado==='pedido'){const id=t.toUpperCase().replace(/[^A-Z0-9]/g,'');const o=S.data.pedidos.find(x=>x.id===id);if(o)return pedStatus(o);if(CFG.API){WC.tmp={id};WC.estado='pedido_email';return botSay('Por segurança, qual o *e-mail* usado na compra?')}WC.estado='menu';return botSay('Não encontrei esse pedido. 🤔 Confira o número no e-mail de confirmação ou fale com um vendedor.',{op:[['humano','👤 Falar com vendedor'],['menu','Menu']]})}
 try{const o=await api('GET',`/api/orders/${WC.tmp.id}?email=${encodeURIComponent(t)}`);return pedStatus(o)}catch(e){WC.estado='menu';return botSay('Não encontrei um pedido com esses dados. 😕',{op:[['humano','👤 Falar com vendedor'],['menu','Menu']]})}}
function pedStatus(o){WC.estado='menu';return botSay(`📦 Pedido *#${o.id}*\nStatus: *${(STATUS[o.status]||[o.status])[0]}*\nTotal: ${brl(o.total)}\n${o.itens.map(i=>`• ${i.qty}× ${i.nome}`).join('\n')}${o.rastreio?`\nRastreio: *${o.rastreio}*`:''}`,{op:[['url:#pedido-'+o.id,'Ver detalhes'],['humano','👤 Falar com vendedor'],['menu','Menu']]})}
async function humano(){if(!WC.nome){WC.estado='h_nome';return botSay(`Vou te passar para nossa equipe de ${SETORES[WC.setor]||'vendas'}! 🙌 Antes, *qual é o seu nome?*`)}
 if(!WC.contato&&!WC.semtel){WC.estado='h_tel';return botSay('Qual seu *WhatsApp com DDD*?',{op:[['semtel','Prefiro falar só por aqui']]})}
 WC.estado='h_motivo';return botSay(`Certo, ${nomeCurto()}! Em poucas palavras, *o que você precisa?*`)}
async function handoff(){const s=ST();WC.modo='fila';WC.estado='fila';WC.protocolo=WC.protocolo||('AT'+Date.now().toString().slice(-6));const t=totals();
 const resumo=`Olá! Protocolo #${WC.protocolo}. Sou ${WC.nome}. ${WC.motivo||''}${t.count?` | Carrinho: ${t.items.map(i=>i.qty+'x '+i.p.nome+(i.v?' ('+i.v+')':'')).join(', ')} (${brl(t.sub)})`:''}`;
 wPush({de:'sys',txt:`Conversa transferida para ${SETORES[WC.setor]||'vendas'} · protocolo #${WC.protocolo}`});
 const num=WC.setor==='comercial'?s.waVendas:s.waVendas;
 await botSay(`✅ Prontinho, ${nomeCurto()}! Você está na *fila de ${SETORES[WC.setor]||'vendas'}*.\nUm atendente vai responder aqui mesmo (${s.horarioAtendimento}).\n\nSe preferir, continue direto no WhatsApp:`,{op:[['url:https://wa.me/'+num+'?text='+encodeURIComponent(resumo),'💬 Continuar no WhatsApp'],['voltarbot','🤖 Voltar ao assistente']]})}
function waProduto(id){const p=S.data.produtos.find(x=>x.id===id);if(!W.open)toggleWA(true);setTimeout(async()=>{if(!WC)wcNew();WC.setor='vendas';const m=wPush({de:'cliente',txt:`Tenho dúvidas sobre: ${p.nome}`});await wcSave([m]);WC.motivo=`Dúvida sobre ${p.nome}`;await botSay(`Posso te ajudar com *${p.nome}* (${brl(priceOf(p))})! Quer adicionar ao carrinho ou falar com um vendedor?`,{op:[['buy:'+p.id,'🛒 Quero comprar'],['humano','👤 Falar com vendedor'],['menu','Menu']]})},WC?50:900)}
const waFmt=t=>esc(t).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
function waMsg(m,ops){const tm=(()=>{try{return new Date(m.d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}})();
 if(m.de==='sys')return`<div class="wm-msg sys">${esc(m.txt)}</div>`;
 let h=`<div class="wm-msg ${m.de}">${m.de==='atendente'?`<span class="who">${esc(m.por||'Atendente')} · Farol FM</span>`:''}${waFmt(m.txt)}<time>${tm}</time></div>`;
 if(m.prods&&m.prods.length)h+=`<div class="wa-prods">${m.prods.map(id=>{const p=S.data.produtos.find(x=>x.id===id);return p?`<div class="wa-prod"><img src="${imgProd(p)}" alt=""><div><b>${esc(p.nome)}</b><span>${brl(priceOf(p))}</span><button data-k="buy:${p.id}" data-l="Quero: ${esc(p.nome)}" onclick="waInput(this.dataset.k,this.dataset.l)">Quero</button><a href="#produto-${p.id}">Ver detalhes</a></div></div>`:''}).join('')}</div>`;
 if(ops&&m.op)h+=`<div class="wa-ops">${m.op.map(([k,l])=>k.startsWith('url:')?`<a href="${esc(k.slice(4))}" ${k.startsWith('url:#')?'':'target="_blank" rel="noopener"'}>${esc(l)}</a>`:`<button data-k="${esc(k)}" data-l="${esc(l)}" onclick="waInput(this.dataset.k,this.dataset.l)">${esc(l)}</button>`).join('')}</div>`;
 return h}
function renderWAbody(){const el=$('#wa');if(!el||!W.open)return;const s=ST();const c=WC;const msgs=c?c.msgs:[];const keep=el.querySelector('.wa-f input');const val=keep?keep.value:'';const foc=keep&&document.activeElement===keep;
 el.innerHTML=`<div class="wa-h"><img src="${LOGO_SRC}" alt=""><div class="grow"><b>Farol FM · Atendimento</b><span>${c&&c.modo==='humano'?'👤 '+esc(c.atendente||'Atendente')+' está te atendendo':c&&c.modo==='fila'?'⏳ Na fila · protocolo #'+esc(c.protocolo||''):'🤖 '+esc(s.botNome)+' · responde na hora'}</span></div><button class="wa-x" onclick="toggleWA()" aria-label="Fechar">×</button></div>
 <div class="wa-b" id="wab">${msgs.map((m,i)=>waMsg(m,i===msgs.length-1||(i===msgs.length-2&&msgs[i+1].de==='sys'))).join('')}${W.typing?'<div class="wm-msg bot typing"><i></i><i></i><i></i></div>':''}</div>
 <form class="wa-f" onsubmit="const v=this.t.value.trim();if(v){this.t.value='';waInput(v)}return false"><input name="t" placeholder="${c&&c.modo!=='bot'?'Escreva para o atendente…':'Digite uma mensagem'}" autocomplete="off" value="${esc(val)}"><button aria-label="Enviar">➤</button></form>
 <div class="wa-foot">Robô 24h · vendedores ${esc(s.horarioAtendimento)} · <a href="https://wa.me/${esc(s.waVendas)}" target="_blank" rel="noopener">abrir no WhatsApp</a></div>`;

const EMAIL_RE=/^(?=.{6,254}$)(?=.{1,64}@)[a-z0-9.!#$%&'*+/=?^_`{|}~-]+@(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}$/;
const DESCARTAVEIS=['mailinator.com','10minutemail.com','guerrillamail.com','tempmail.com','temp-mail.org','yopmail.com','trashmail.com','sharklasers.com','getnada.com','dispostable.com','maildrop.cc','fakeinbox.com','throwawaymail.com','emailondeck.com','mintemail.com','mohmal.com','tempail.com','moakt.com','tempmailo.com','emailfake.com','spamgourmet.com','mailnesia.com','burnermail.io','tmail.ws'];
const TYPOS={'gmial.com':'gmail.com','gmal.com':'gmail.com','gmai.com':'gmail.com','gmail.co':'gmail.com','gmail.con':'gmail.com','gmail.cm':'gmail.com','gnail.com':'gmail.com','gamil.com':'gmail.com','gmaill.com':'gmail.com','gmail.com.br':'gmail.com','gmail.br':'gmail.com','hotmial.com':'hotmail.com','hotmal.com':'hotmail.com','hotmail.co':'hotmail.com','hotmail.con':'hotmail.com','hotmai.com':'hotmail.com','outlok.com':'outlook.com','outloo.com':'outlook.com','outlook.co':'outlook.com','yahoo.com.b':'yahoo.com.br','yaho.com.br':'yahoo.com.br','yahoo.co':'yahoo.com','bol.com':'bol.com.br','uol.com':'uol.com.br','icloud.co':'icloud.com','icloud.con':'icloud.com'};
function checkEmail(e){e=String(e||'').trim().toLowerCase();if(!e)return{ok:false,msg:'Informe seu e-mail'};
 if(!EMAIL_RE.test(e))return{ok:false,msg:'Formato inválido — confira se tem “@” e o domínio (ex.: nome@gmail.com)'};
 const[l,d]=e.split('@');if(/^\.|\.$|\.\./.test(l))return{ok:false,msg:'E-mail inválido: pontos no início, no fim ou repetidos'};
 if(TYPOS[d])return{ok:false,msg:`Você quis dizer ${l}@${TYPOS[d]}?`,sug:`${l}@${TYPOS[d]}`};
 if(DESCARTAVEIS.includes(d))return{ok:false,msg:'E-mails temporários/descartáveis não são aceitos'};
 if(d==='gmail.com'||d==='googlemail.com'){const b=l.split('+')[0].replace(/\./g,'');if(!/^[a-z0-9]{6,30}$/.test(b))return{ok:false,msg:'Endereço Gmail inválido: use de 6 a 30 letras ou números antes do @gmail.com'}}
 return{ok:true,email:e,gmail:d==='gmail.com'||d==='googlemail.com',msg:d==='gmail.com'?'✓ Gmail válido':'✓ E-mail válido'}}
function checkSenha(p){p=String(p||'');const r=[p.length>=8,/[a-zA-Z]/.test(p),/\d/.test(p),/[^A-Za-z0-9]/.test(p)||p.length>=12];return{ok:r[0]&&r[1]&&r[2],score:r.filter(Boolean).length}}
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('farol:'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(unescape(encodeURIComponent(t)))}}

function atdChat(c){const tel=String(c.contato||'').replace(/\D/g,'');const s=ST();const nome=S.adm.nome||'Atendente';
 const qr=[`Olá, ${(c.nome||'').split(' ')[0]}! Aqui é ${nome}, da Farol FM. Como posso te ajudar? 😊`,'Vou verificar e já te retorno, só um instante.',`Para finalizar, é só acessar o carrinho no site: PIX com ${s.pixDesconto}% de desconto ou cartão.`,'Obrigado pela compra! Deus abençoe. 🙏'];
 return`<div class="atd-ch"><div class="grow"><b>${esc(c.nome||'Visitante')}</b> <span class="badge ${MODO[c.modo][1]}">${MODO[c.modo][0]}</span><div class="small muted">${c.canal==='whatsapp'?'WhatsApp':'Chat do site'} ${tel?'· +'+esc(tel):''} ${c.protocolo?'· #'+esc(c.protocolo):''} ${c.atendente?'· '+esc(c.atendente):''}${c.motivo?'<br>📝 '+esc(c.motivo):''}</div></div>

async function atdSend(id){const el=$('#atdtxt');const txt=el.value.trim();if(!txt)return;const c=S.data.conversas.find(x=>x.id===id);el.value='';

 if(CFG.API){try{S.data.conversas=await api('GET','/api/admin/conversas')}catch(e){}}else{S.data.conversas=LS.get('fr_conversas',S.data.conversas)}
 if(JSON.stringify(S.data.conversas.map(c=>[c.id,c.msgs.length,c.modo]))!==before){const v=$('#atdtxt')?$('#atdtxt').value:'';const f=document.activeElement&&document.activeElement.id==='atdtxt';renderMain();if($('#atdtxt')){$('#atdtxt').value=v;if(f)$('#atdtxt').focus()}}else admPoll()},4000)}

 ['LOJA',[['loja','🛍️','Painel da loja'],['pedidos','🧾','Pedidos'],['clientes','🧑‍🤝‍🧑','Clientes'],['produtos','📦','Produtos'],['estoque','📊','Estoque'],['promocoes','🏷️','Promoções'],['cupons','🎟️','Cupons'],['campanhas','📧','Campanhas de e-mail'],['financeiro','💰','Financeiro'],['pagamentos','💳','Pagamentos & frete']]]];

 admin:{n:'Administrador',ic:'👑',d:'Acesso total, inclusive usuários e aparência do site',m:'*',pub:true},
 editor:{n:'Editor-chefe',ic:'🗞️',d:'Redação completa: escreve, revisa e publica',m:['dash','redacao','posts','comentarios','videos','oracoes','radio','redes'],pub:true},
 jornalista:{n:'Jornalista / Repórter',ic:'✍️',d:'Escreve matérias e envia para revisão do editor',m:['dash','redacao','posts','comentarios','videos'],pub:false},
 colunista:{n:'Colunista',ic:'🖋️',d:'Escreve colunas e artigos para revisão',m:['dash','posts'],pub:false},
 locutor:{n:'Locutor / Produção',ic:'🎙️',d:'Rádio, programação, pedidos de música e de oração',m:['dash','radio','oracoes','redes','videos'],pub:false},
 gerente:{n:'Gerente da loja',ic:'🛍️',d:'Loja completa, financeiro e atendimento',m:['dash','loja','pedidos','clientes','produtos','estoque','promocoes','cupons','campanhas','financeiro','pagamentos','atendimento'],pub:false},

const papelOk=p=>p==='redacao'?'editor':p==='loja'?'gerente':p;
const userMods=u=>{if(!u)return[];const p=papelOk(u.papel);if(p==='admin')return Object.keys(MODULOS);return(u.modulos&&u.modulos.length?u.modulos:(PERFIS[p]||{m:[]}).m)};

function fieldsHTML(fs,d){return fs.map(f=>{let v=d[f.k]??'';const w=f.w||'';
 if(f.type==='datetime-local'&&v){try{const x=new Date(v);v=new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,16)}catch(e){}}
 if(f.type==='textarea')return`<label class="fl ${w}">${f.l}<textarea name="${f.k}" rows="${f.rows||4}">${esc(v)}</textarea></label>`;
 if(f.type==='select')return`<label class="fl ${w}">${f.l}<select name="${f.k}">${f.opts().map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;
 if(f.type==='checkbox')return`<label class="fl ck ${w}"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${f.l}</label>`;
 if(f.type==='image')return`<div class="fl ${w}">${f.l}<div class="row"><img class="imgprev" id="prev_${f.k}" src="${v||ph('x','🖼️','')}"><div><input type="file" accept="image/*" onchange="pickImg(this,'${f.k}',${f.max||900})"><input type="hidden" name="${f.k}" value="${esc(v)}"><div class="small muted">Redimensionada automaticamente. <a href="javascript:void 0" style="color:var(--bad)" onclick="this.closest('.fl').querySelector('[type=hidden]').value='';$('#prev_${f.k}').src='${ph('x','🖼️','')}'">Remover</a></div></div></div></div>`;
 return`<label class="fl ${w}">${f.l}<input name="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="0.01"':''} ${f.req?'required':''} value="${esc(v)}" ${f.upper?'style="text-transform:uppercase"':''}></label>`}).join('')}
function readForm(f,fs,base={}){const o={...base};for(const x of fs){const el=f.elements[x.k];if(!el)continue;if(x.type==='checkbox')o[x.k]=el.checked;else if(x.type==='number')o[x.k]=el.value===''?'':+el.value;else if(x.type==='datetime-local')o[x.k]=el.value?new Date(el.value).toISOString():new Date().toISOString();else o[x.k]=x.upper?el.value.trim().toUpperCase():el.value}return o}
function pickImg(inp,k,maxW){const file=inp.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const max=maxW||900;const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.8);inp.parentNode.querySelector('[type=hidden]').value=u;$('#prev_'+k).src=u};im.src=rd.result};rd.readAsDataURL(file)}
function admList(c){const d=COLDEF[c];let a=[...S.data[c]];if(d.sort)a.sort(d.sort);const f=(S.adm.f||{})[c]||'todos';const q=slug((S.adm.q||{})[c]||'');

async function admStatus(id,s){const o=S.data.pedidos.find(x=>x.id===id);
 if(CFG.API){try{Object.assign(o,await api('POST',`/api/admin/orders/${id}/status`,{status:s}))}catch(e){toast(e.message);return}}
 else{if(s==='pago')markPaid(o,'Pagamento confirmado manualmente no painel');else{if(['cancelado','estornado'].includes(s)&&paidSt.includes(o.status)){o.itens.forEach(i=>{const p=S.data.produtos.find(x=>x.id===i.id);if(p)p.estoque=+p.estoque+i.qty});DB.persist('produtos')}o.status=s;o.historico.push({d:new Date().toISOString(),s:'Status: '+STATUS[s][0]})}DB.persist('pedidos')}
 toast('Status atualizado');admOrder(id);renderMain()}
async function admRastreio(id,v){const o=S.data.pedidos.find(x=>x.id===id);o.rastreio=v;o.historico.push({d:new Date().toISOString(),s:'Rastreio: '+v});if(CFG.API)await DB.save('pedidos',o).catch(e=>toast(e.message));else DB.persist('pedidos');toast('Rastreio salvo')}
function admFin(){const days=S.adm.fd??30;const s=ST();const ps=periodOrders(days);const paid=ps.filter(o=>paidSt.includes(o.status));
 const sum=(a,k='total')=>r2(a.reduce((x,o)=>x+(+o[k]||0),0));const bruto=sum(paid);
 const taxa=o=>r2((+o.total)*((o.metodo==='pix'?s.taxaPix:o.metodo==='credito'?s.taxaCredito:s.taxaDebito)/100));const taxas=r2(paid.reduce((a,o)=>a+taxa(o),0));
 const by=['pix','credito','debito'].map(m=>({m,v:sum(paid.filter(o=>o.metodo===m)),n:paid.filter(o=>o.metodo===m).length}));
 const nd=Math.min(days||30,30);const daysArr=[...Array(nd)].map((_,i)=>{const d0=today0()-(nd-1-i)*864e5;const v=sum(paid.filter(o=>{const t=Date.parse(o.pagoEm||o.data);return t>=d0&&t<d0+864e5}));return{d:new Date(d0),v}});const mx=Math.max(1,...daysArr.map(x=>x.v));
 const topP={};paid.forEach(o=>o.itens.forEach(i=>{topP[i.nome]=(topP[i.nome]||0)+i.line}));const tops=Object.entries(topP).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const pend=ps.filter(o=>o.status==='aguardando');const canc=ps.filter(o=>['cancelado','estornado','recusado'].includes(o.status));
 return`<div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 style="margin:0">Financeiro</h2><div class="chips" style="margin:0">${[[7,'7 dias'],[30,'30 dias'],[90,'90 dias'],[0,'Tudo']].map(([v,t])=>`<button class="${days===v?'on':''}" onclick="S.adm.fd=${v};route()">${t}</button>`).join('')}</div></div>
 <div class="kpis" style="margin-top:16px"><div class="card kpi"><span>Receita bruta</span><b>${brl(bruto)}</b></div><div class="card kpi"><span>Taxas estimadas</span><b style="color:var(--bad)">− ${brl(taxas)}</b></div><div class="card kpi"><span>Receita líquida</span><b style="color:var(--ok)">${brl(bruto-taxas)}</b></div><div class="card kpi"><span>Ticket médio</span><b>${brl(paid.length?bruto/paid.length:0)}</b></div>
 <div class="card kpi"><span>Descontos concedidos</span><b>${brl(sum(paid,'desconto')+sum(paid,'descontoPix'))}</b></div><div class="card kpi"><span>Frete cobrado</span><b>${brl(sum(paid,'frete'))}</b></div><div class="card kpi"><span>A receber (pendente)</span><b style="color:var(--warn)">${brl(sum(pend))}</b></div><div class="card kpi"><span>Cancel./recusados</span><b>${canc.length}</b></div></div>
 <div class="grid g2" style="margin-top:18px"><div class="card widget"><h4>Receita por dia (últimos ${nd} dias)</h4><div class="bars">${daysArr.map(x=>`<div style="height:${x.v/mx*100}%" data-t="${x.d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}: ${brl(x.v)}"></div>`).join('')}</div></div>
 <div class="card widget"><h4>Por forma de pagamento</h4>${by.map(b=>`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span>${b.m==='pix'?'PIX':b.m==='credito'?'Cartão de crédito':'Cartão de débito'} <span class="small muted">(${b.n})</span></span><b>${brl(b.v)}</b></div><div class="hbar"><i style="width:${bruto?b.v/bruto*100:0}%"></i></div></div>`).join('')}
 <h4 style="margin-top:16px">Mais vendidos</h4>${tops.map(([n,v])=>`<div class="row small" style="justify-content:space-between;padding:3px 0"><span>${esc(n)}</span><b>${brl(v)}</b></div>`).join('')||'<p class="muted small">Sem vendas no período.</p>'}</div></div>
 <div class="row" style="justify-content:space-between;margin:20px 0 10px"><h3 style="margin:0">Lançamentos</h3><button class="btn ghost sm" onclick="exportCSV(${days})">${ic('copy')} Exportar CSV</button></div>
 <div class="card tblwrap"><table class="t"><thead><tr><th>Data</th><th>Pedido</th><th>Forma</th><th>Bruto</th><th>Taxa</th><th>Líquido</th><th>Status</th></tr></thead><tbody>${ps.map(o=>{const pd=paidSt.includes(o.status);return`<tr><td>${fdt(o.pagoEm||o.data)}</td><td>#${o.id}</td><td>${o.metodo.toUpperCase()}</td><td>${brl(o.total)}</td><td>${pd?'− '+brl(taxa(o)):'—'}</td><td>${pd?brl(o.total-taxa(o)):'—'}</td><td>${stBadge(o.status)}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Sem lançamentos.</td></tr>'}</tbody></table></div>
 <p class="small muted">Taxas estimadas conforme percentuais configurados em Pagamentos & frete. Os valores oficiais de repasse ficam no extrato do Mercado Pago.</p>`}
function exportCSV(days){const rows=[['data','pedido','cliente','forma','parcelas','subtotal','desconto','desconto_pix','frete','total','status']];periodOrders(days).forEach(o=>rows.push([o.pagoEm||o.data,o.id,o.cliente.nome,o.metodo,o.cartao?o.cartao.parcelas:1,o.subtotal,o.desconto,o.descontoPix,o.frete,o.total,o.status]));
 const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='financeiro-farol-fm.csv';a.click()}catch(e){}
 openModal(`<h3>CSV do financeiro</h3><p class="small muted">Se o download não começou, copie abaixo e cole no Excel/Planilhas.</p><textarea style="width:100%;height:240px;font-family:monospace;font-size:12px" readonly>${esc(csv)}</textarea><button class="btn" onclick="copyTxt(this.previousElementSibling.value)">Copiar</button>`)}
function admOracoes(){return`<h2>Pedidos de música</h2><div class="grid" style="gap:10px;margin-bottom:26px">${S.data.musicas.map(o=>`<div class="card widget row" style="${o.lido?'opacity:.55':''}"><span style="font-size:22px">🎶</span><div class="grow"><b>${esc(o.nome||'Ouvinte')}</b> <span class="small muted">· ${esc(o.origem||'site')} · ${fdt(o.data)}</span><div>${esc(o.texto)}</div></div><button class="btn ghost sm" onclick="(async()=>{const x=S.data.musicas.find(y=>y.id==='${o.id}');x.lido=!x.lido;await DB.save('musicas',x);renderMain()})()">${o.lido?'Desfazer':'✓ Tocada'}</button></div>`).join('')||'<p class="muted">Nenhum pedido de música.</p>'}</div><h2>Pedidos de oração</h2><div class="grid" style="gap:12px">${S.data.oracoes.map(o=>`<div class="card widget" style="${o.lido?'opacity:.6':''}"><div class="row"><b class="grow">${esc(o.nome)} <span class="small muted">· ${esc(o.cidade||'')} · ${fdt(o.data)}</span></b>${o.noAr?'<span class="badge info">Pode ler no ar</span>':'<span class="badge">Reservado</span>'}</div><p style="margin:8px 0">${esc(o.texto)}</p><button class="btn ghost sm" onclick="(async()=>{const x=S.data.oracoes.find(y=>y.id==='${o.id}');x.lido=!x.lido;await DB.save('oracoes',x);route()})()">${o.lido?'Marcar como não lido':'✓ Marcar como orado'}</button> <button class="btn ghost sm" onclick="admDel('oracoes','${o.id}')">🗑</button></div>`).join('')||'<p class="muted">Nenhum pedido ainda.</p>'}</div>`}
function admComentarios(){const f=S.admComF||'pendente';const cs=S.data.comentarios||[];const cnt=k=>cs.filter(c=>comSt(c)===k).length;
 const tit=id=>{const p=S.data.posts.find(x=>x.id===id);return p?p.titulo:'(notícia removida)'};
 const l=cs.filter(c=>f==='todos'||comSt(c)===f).sort((a,b)=>String(b.data).localeCompare(a.data)).slice(0,200);
 const B={pendente:'<span class="badge warn">Aguardando</span>',aprovado:'<span class="badge ok">Publicado</span>',oculto:'<span class="badge">Oculto</span>'};
 return`<h2>💭 Comentários dos leitores</h2><p class="muted small">Modere o que aparece no fim das notícias. Comentários com palavras bloqueadas ou links sempre aguardam aprovação.</p>
 <div class="chips">${[['pendente','⏳ Aguardando'],['aprovado','✅ Publicados'],['oculto','🚫 Ocultos'],['todos','Todos']].map(([k,n])=>`<button class="${f===k?'on':''}" onclick="S.admComF='${k}';renderMain()">${n} (${k==='todos'?cs.length:cnt(k)})</button>`).join('')}</div>
 <div class="grid" style="gap:12px;margin:14px 0 26px">${l.map(c=>`<div class="card widget"><div class="row" style="gap:8px;align-items:flex-start"><div class="grow"><b>${esc(c.nome)}</b>${c.equipe?' <span class="badge info">Farol FM</span>':''} <span class="small muted">· ${fdt(c.data)}${c.email?' · '+esc(c.email):''}${c.pai?' · resposta':''}${c.curtidas?' · 🙏 '+c.curtidas:''}</span><div class="small muted">em <a href="#post-${esc(c.postId)}" style="color:var(--pri)">${esc(tit(c.postId))}</a></div></div>${B[comSt(c)]||''}</div>
  <p style="margin:8px 0;overflow-wrap:anywhere">${esc(c.texto)}</p><div class="row" style="gap:6px;flex-wrap:wrap">${comSt(c)!=='aprovado'?`<button class="btn sm" onclick="comMod('${esc(c.id)}','aprovado')">✓ Aprovar</button>`:''}${comSt(c)!=='oculto'?`<button class="btn ghost sm" onclick="comMod('${esc(c.id)}','oculto')">🚫 Ocultar</button>`:''}<button class="btn ghost sm" onclick="comAdmResp('${esc(c.id)}')">💬 Responder como Farol FM</button><button class="btn ghost sm" onclick="admDel('comentarios','${esc(c.id)}')">🗑</button></div></div>`).join('')||'<p class="muted">Nenhum comentário nesta lista.</p>'}</div>
 ${setForm('Configurações dos comentários',SETF.comentarios=[{k:'comentariosAtivo',l:'Permitir comentários no fim das notícias',type:'checkbox',w:'full'},{k:'comentariosModeracao',l:'Moderação',type:'select',opts:()=>[['auto','Publicar na hora (filtro automático segura os suspeitos)'],['previa','Todos aguardam aprovação antes de aparecer']]},{k:'comentariosLogin',l:'Exigir conta do site para comentar',type:'checkbox'},{k:'palavrasBloqueadas',l:'Palavras bloqueadas (separadas por vírgula)',type:'textarea',rows:3,w:'full'}])}`}
async function comMod(id,st){const c=S.data.comentarios.find(x=>x.id===id);if(!c)return;c.status=st;try{await DB.save('comentarios',c);toast(st==='aprovado'?'Comentário publicado':'Comentário ocultado');renderMain()}catch(e){toast(e.message)}}
function comAdmResp(id){const c=S.data.comentarios.find(x=>x.id===id);if(!c)return;openModal(`<h3>Responder como Farol FM</h3><p class="small muted">Para <b>${esc(c.nome)}</b>: “${esc(String(c.texto).slice(0,140))}”</p><form class="form" onsubmit="return comAdmEnviar(event,'${esc(id)}')"><label class="fl full">Resposta<textarea name="t" rows="4" maxlength="1000" required></textarea></label><div class="fl"><button class="btn">Publicar resposta</button></div></form>`)}

 try{if(comSt(c)!=='aprovado'){c.status='aprovado';await DB.save('comentarios',c)}await DB.save('comentarios',{id:uid(),postId:c.postId,pai:c.pai||c.id,nome:'Redação Farol FM',equipe:true,autorId:S.adm.user&&S.adm.user.id,texto:t.slice(0,1000),data:new Date().toISOString(),curtidas:0,status:'aprovado'});closeModal();toast('Resposta publicada na notícia');renderMain()}catch(err){toast(err.message)}return false}

 us=[{id:'u-admin',nome:'Administrador',email:'admin@farolradiotv.com.br',papel:'admin',cargo:'Direção',hash:h,ativo:true,criado:now},{id:'u-jorn',nome:'Ana Repórter',email:'jornalista@farolradiotv.com.br',papel:'jornalista',cargo:'Repórter',hash:h,ativo:true,criado:now},{id:'u-vend',nome:'Carlos Vendas',email:'vendas@farolradiotv.com.br',papel:'vendedor',cargo:'Vendedor',hash:h,ativo:true,criado:now}];LS.set('fr_usuarios',us);return us}

function setAdmUser(u){S.adm.user=u;S.adm.papel=papelOk(u.papel);S.adm.nome=u.nome}
async function admLogin(e){e.preventDefault();const f=e.target;const em=f.email.value.trim().toLowerCase();
 try{if(CFG.API){const j=await api('POST','/api/login',{email:em,senha:f.senha.value});S.adm.token=j.token;setAdmUser(j.user||{nome:j.nome,papel:j.papel,email:em});LS.set('fr_tok',j.token);LS.set('fr_admu',S.adm.user);await DB.adminLoad()}
  else{const us=await demoUsers();const u=us.find(x=>x.email.toLowerCase()===em);if(!u||u.hash!==await sha(f.senha.value))throw new Error('E-mail ou senha incorretos');if(u.ativo===false)throw new Error('Usuário desativado. Fale com o administrador.');u.ultimoAcesso=new Date().toISOString();LS.set('fr_usuarios',us);setAdmUser(pubUser(u));try{sessionStorage.setItem('fr_adm',JSON.stringify(S.adm.user))}catch(e){}}

   const sen=dados.senha;delete dados.senha;Object.assign(o,dados);if(sen)o.hash=await sha(sen);if(!o.hash)throw new Error('Defina uma senha');if(!id)us.push(o);
   if(!us.some(x=>papelOk(x.papel)==='admin'&&x.ativo!==false))throw new Error('Precisa existir pelo menos um administrador ativo');LS.set('fr_usuarios',us)}
  closeModal();toast('Usuário salvo');renderMain()}catch(err){toast(err.message)}return false}
function userDel(id){const u=usersList().find(x=>x.id===id);openModal(`<h3>Excluir ${esc(u.nome)}?</h3><p class="muted">A pessoa perde o acesso ao painel. Se preferir, apenas <b>desative</b> o usuário.</p><div class="row"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="userDelOk('${id}')">Excluir</button></div>`)}
async function userDelOk(id){try{if(CFG.API){await api('DELETE','/api/admin/usuarios/'+id);S.data.usuarios=S.data.usuarios.filter(x=>x.id!==id)}else{const us=LS.get('fr_usuarios',[]).filter(x=>x.id!==id);if(!us.some(x=>papelOk(x.papel)==='admin'&&x.ativo!==false))throw new Error('Precisa existir pelo menos um administrador ativo');LS.set('fr_usuarios',us)}closeModal();renderMain()}catch(e){toast(e.message)}}
function admPerfil(){const u=S.adm.user||{};const p=papelOk(u.papel);
 return`<h2>Meu perfil</h2><div class="grid g2"><div class="card widget"><div class="row" style="gap:14px"><span class="av-u" style="width:58px;height:58px;font-size:20px">${esc((u.nome||'?').split(' ').slice(0,2).map(w=>w[0]).join(''))}</span><div><b style="font-size:18px">${esc(u.nome||'')}</b><div class="small muted">${esc(u.email||'')}${u.cargo?' · '+esc(u.cargo):''}</div><span class="badge info" style="margin-top:6px">${esc((PERFIS[p]||{}).ic||'')} ${esc(PAPEIS[p]||'')}</span></div></div>
 <h4 style="margin-top:18px">Seus módulos</h4><div class="chips" style="margin:0">${userMods(u).map(k=>`<button onclick="admGo('${k}')">${esc(MODULOS[k][0])}</button>`).join('')}</div>${canPub()?'<p class="small" style="color:var(--ok)">✓ Você pode publicar notícias diretamente.</p>':'<p class="small muted">Suas matérias passam pela revisão do editor antes de publicar.</p>'}</div>
 <div class="card widget"><h4>Alterar senha</h4><form class="form" onsubmit="return mePass(event)"><label class="fl">Senha atual<input name="atual" type="password" required autocomplete="current-password"></label><label class="fl">Nova senha<input name="nova" type="password" required minlength="8" autocomplete="new-password" oninput="liveSenha(this)"><div class="pw-m"><i></i></div><span class="fhint"></span></label><div class="fl"><button class="btn">Salvar nova senha</button></div></form></div></div>`}
async function mePass(e){e.preventDefault();const f=e.target;if(!checkSenha(f.nova.value).ok)return toast('Senha fraca: mínimo 8 caracteres com letras e números'),false;
 try{if(CFG.API)await api('PUT','/api/admin/me',{senhaAtual:f.atual.value,senha:f.nova.value});else{const us=await demoUsers();const u=us.find(x=>x.id===S.adm.user.id);if(!u||u.hash!==await sha(f.atual.value))throw new Error('Senha atual incorreta');u.hash=await sha(f.nova.value);LS.set('fr_usuarios',us)}f.reset();toast('Senha alterada!')}catch(err){toast(err.message)}return false}


/* ===================== NAVEGAÇÃO: voltar / início / trilha ===================== */
function trail(r,a){const L0=['inicio','Início'];const loja=['loja','Loja'];
 const p=r==='post'?S.data.posts.find(x=>x.id===a):null;const pr=r==='produto'?S.data.produtos.find(x=>x.id===a):null;
 const cat=r==='cat'?(cats().find(x=>slug(x)===a)||a):'';
 const T={cat:[L0,[null,cat]],tag:[L0,[null,'#'+a]],colunas:[L0,[null,'Colunas']],videos:[L0,[null,'TV & Redes']],redes:[L0,[null,'TV & Redes']],radio:[L0,[null,'Rádio ao vivo']],oracao:[L0,[null,'Pedido de oração']],contato:[L0,[null,'Contato']],busca:[L0,[null,'Busca']],privacidade:[L0,[null,'Privacidade']],
  post:p?[L0,['cat-'+slug(p.categoria),p.categoria],[null,p.titulo]]:[L0,[null,'Notícia']],
  loja:[L0,[null,'Loja']],produto:[L0,loja,...(pr?[[null,pr.nome]]:[])],carrinho:[L0,loja,[null,'Carrinho']],checkout:[L0,loja,['carrinho','Carrinho'],[null,'Pagamento']],
  meuspedidos:[L0,loja,[null,'Meus pedidos']],pedido:[L0,loja,['meuspedidos','Meus pedidos'],[null,'Pedido #'+a]],conta:[L0,loja,[null,'Minha conta']]};
 return T[r]||[L0,[null,'Página']]}
function navBar(r,a){const t=trail(r,a);const up=[...t].reverse().find(x=>x[0])||['inicio','Início'];
 return`<div class="navbk"><div class="wrap"><button class="nb-btn" onclick="goBack('${up[0]}')" aria-label="Voltar para ${esc(up[1])}"><span class="ar">←</span><span class="lbl">Voltar${up[0]!=='inicio'?' para '+esc(up[1].length>22?up[1].slice(0,21)+'…':up[1]):''}</span></button><a class="nb-btn home" href="#inicio" aria-label="Página inicial">${ic('home')}<span class="lbl">Início</span></a>
 <nav class="nb-crumbs" aria-label="Você está em">${t.map((x,i)=>x[0]?`<a href="#${x[0]}">${esc(x[1])}</a><span>›</span>`:`<b>${esc(x[1])}</b>`).join('')}</nav></div></div>`}
function goBack(up){location.hash=up}


/* ---- equilibra as 3 colunas da grade (preenche o que sobrar) ---- */
/* capa: preenche o espaço vazio da coluna de notícias quando a coluna lateral (rádio, versículo, mais lidas, banner) é mais alta */
function htBalance(){const ht=document.querySelector('.home-top');if(!ht)return;
 const soc=ht.querySelector('.ht-soc');if(soc){[...soc.children].reverse().forEach(c=>ht.after(c));soc.remove()}/* devolve "Farol nas redes" ao lugar original */
 ht.querySelectorAll('.ht-fill').forEach(e=>e.remove());if(innerWidth<=960)return;
 const L=ht.firstElementChild,A=ht.querySelector('aside');if(!L||!A)return;
 const fim=()=>{const k=[...L.children];return k.length?k[k.length-1].getBoundingClientRect().bottom-L.getBoundingClientRect().top:0};
 let gap=A.getBoundingClientRect().height-fim();if(gap<140)return;
 const vistos=new Set([...document.querySelectorAll('#main a[href^="#post-"]')].map(a=>a.getAttribute('href').slice(6)));
 const t=ht.nextElementSibling,g2=t&&t.nextElementSibling;
 if(gap>=320&&t&&t.classList.contains('sec-title')&&g2&&g2.classList.contains('soc-grid')){const box=document.createElement('div');box.className='ht-fill ht-soc';L.appendChild(box);box.appendChild(t);box.appendChild(g2);gap=A.getBoundingClientRect().height-fim();if(gap<0){[...box.children].reverse().forEach(c=>ht.after(c));box.remove();gap=A.getBoundingClientRect().height-fim()}}
 if(gap<140)return;
 const resto=postsSorted().filter(p=>!vistos.has(p.id));
 if(resto.length){const box=document.createElement('div');box.className='ht-fill';box.innerHTML=`<div class="sec-title"><h2>Mais notícias</h2><a href="#busca" onclick="S.q=''">Ver todas →</a></div><div class="grid" style="gap:12px"></div>`;L.appendChild(box);const g=box.querySelector('.grid');
  for(const p of resto){g.insertAdjacentHTML('beforeend',lst(p));if(A.getBoundingClientRect().height-fim()<120)break}}
 gap=A.getBoundingClientRect().height-fim();
 if(gap>=200){const wa=esc(ST().waEstudio||ST().waVendas||'');
  const cards=[['#oracao','🙏','Precisa de oração?','Envie seu pedido. Nossa equipe e os ouvintes da Farol FM oram por você.'],['#radio','📻','Ouça a Rádio Farol FM','Louvor, Palavra e notícias ao vivo, 24 horas.'],
   [`https://wa.me/${wa}?text=${encodeURIComponent('Olá! Tenho uma sugestão de notícia para a Farol FM:')}`,'📰','Tem uma notícia?','Envie sua sugestão de pauta para a redação pelo WhatsApp.'],['#conta','💌','Clube Farol','Crie sua conta grátis e receba promoções da loja.'],
   [`https://wa.me/${wa}?text=${encodeURIComponent('Olá! Quero pedir uma música na Rádio Farol FM:')}`,'🎶','Peça sua música','Mande seu pedido e sua mensagem para o estúdio.'],['#loja','🛍️','Loja Farol FM','Bíblias, livros, camisetas e presentes com entrega ou retirada.']];
  const box=document.createElement('div');box.className='ht-fill ht-cta';L.appendChild(box);
  for(let k=0;k<cards.length;k+=2){const add=cards.slice(k,k+2).map(([h,e,t,d])=>`<a class="card ht-c" href="${h}"${/^https/.test(h)?' target="_blank" rel="noopener"':''}><span>${e}</span><div><b>${t}</b><p class="small muted">${d}</p></div></a>`).join('');
   box.insertAdjacentHTML('beforeend',add);const g=A.getBoundingClientRect().height-fim();if(g<0&&k>0){[...box.children].slice(-2).forEach(c=>c.remove());break}if(g<90)break}}}
function glBalance(){htBalance();const g=document.querySelector('.gl');if(!g||innerWidth<=960)return;g.querySelectorAll('.gl-fill').forEach(e=>e.remove());
 const cols=[...g.children].filter(c=>/gl-c\d/.test(c.className));if(cols.length<3)return;
 const used=new Set([...document.querySelectorAll('#main a[href^="#post-"]')].map(a=>a.getAttribute('href')));
 const pool=postsSorted().filter(p=>!used.has('#post-'+p.id));
 const mk=h=>{const d=document.createElement('div');d.innerHTML=h.trim();const el=d.firstChild;el.classList.add('gl-fill');return el};
 const vids=ytVideos().slice(0,3);const colun=postsSorted().filter(p=>p.tipo&&p.tipo!=='Notícia'&&p.tipo!=='Agenda').slice(0,3);const v=verseOfDay();
 const fillers=[
  vids.length?`<div class="gl-box"><h4>▶ Vídeos da Farol TV</h4><div class="vd">${vids.map(x=>`<a href="javascript:void 0" onclick="playYT('${esc(x.id)}',${esc(JSON.stringify(x.titulo))})"><img src="https://i.ytimg.com/vi/${encodeURIComponent(x.id)}/mqdefault.jpg" alt="" onerror="this.src='${ph(x.id,'▶️','')}'">${esc(trunc(x.titulo,60))}</a>`).join('')}</div></div>`:`<div class="gl-box"><h4>▶ Farol TV</h4><a class="row" href="#redes" style="gap:12px"><img src="${LOGO_SRC}" style="width:54px;height:54px;border-radius:50%" alt=""><div><b>Assista à Farol Radio TV</b><div class="small muted">Transmissões ao vivo, cultos e programas no YouTube</div></div></a></div>`,
  colun.length?`<div class="gl-box"><h4>✍️ Colunas e artigos</h4>${colun.map(p=>`<a class="cl" href="#post-${p.id}"><span class="av">${esc(String(p.autor||'R').split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join(''))}</span><div><div class="small muted">${esc(p.autor||'')}</div><b style="font-size:14px">${esc(trunc(p.titulo,70))}</b></div></a>`).join('')}</div>`:'',
  `<div class="gl-box verse" style="border:0"><h4 style="color:rgba(255,255,255,.75)">Versículo do dia</h4><q>${esc(v.t)}</q><cite>${esc(v.r)}</cite></div>`,
  `<a class="gl-box" href="#oracao" style="display:block"><h4>🙏 Pedido de oração</h4><b>Nossa equipe ora por você</b><div class="small muted">Envie seu pedido — ele pode ser lido no ar na Hora da Oração.</div></a>`,
  `<a class="gl-box" href="#conta" style="display:block"><h4>💌 Clube Farol</h4><b>Receba promoções e novidades</b><div class="small muted">Crie sua conta grátis${ST().cupomBoasVindas?' e ganhe o cupom '+esc(ST().cupomBoasVindas):''}.</div></a>`
 ].filter(Boolean);
 const H=c=>[...c.children].reduce((t,e)=>{const r=e.getBoundingClientRect(),st=getComputedStyle(e);return t+r.height+parseFloat(st.marginTop)+parseFloat(st.marginBottom)},0);
 for(let k=0;k<14;k++){const h=cols.map(H);const max=Math.max(...h);const i=h.indexOf(Math.min(...h));const gap=max-h[i];if(gap<80)break;
  let el=null;if(gap>=230&&fillers.length)el=mk(fillers.shift());else if(pool.length){const p=pool.shift();el=mk(`<a class="gl-hl" href="#post-${p.id}" style="--cc:${catCor(p.categoria)}"><span>${esc(p.chapeu||p.categoria)}</span><b>${esc(p.titulo)}</b></a>`)}else if(fillers.length)el=mk(fillers.shift());
  if(!el)break;cols[i].appendChild(el)}}
let glT=null;addEventListener('resize',()=>{clearTimeout(glT);glT=setTimeout(glBalance,250)});

/* ===================== ROTEADOR ===================== */
let curRoute='inicio';const STORE_R=['loja','produto','carrinho','checkout','pedido','meuspedidos','conta'];
function storeBar(r){const t=totals();return`<div class="storebar"><div class="wrap"><a class="sb-t" href="#loja">${ic('bag')}<span>Loja <b>Farol FM</b></span></a><form class="sb-q" onsubmit="S.shopQ=this.q.value.trim();location.hash='loja';if(curRoute==='loja')renderMain();return false"><input name="q" placeholder="Buscar produtos..." value="${esc(S.shopQ||'')}"><button aria-label="Buscar">${ic('search')}</button></form>
 <nav class="sb-l"><a href="#loja" class="${r==='loja'?'on':''}">Produtos</a><a href="#conta" class="sb-acc ${r==='conta'?'on':''}" aria-label="Minha conta">${ic('user')}<span class="sb-at">${S.me?esc((S.me.nome||'').split(' ')[0]):'Entrar / criar conta'}</span></a><a href="#meuspedidos" class="${r==='meuspedidos'||r==='pedido'?'on':''}">Meus pedidos</a><a href="#carrinho" class="sb-cart ${r==='carrinho'||r==='checkout'?'on':''}">${ic('cart')} ${t.count?`${t.count} · ${brl(t.sub)}`:'Carrinho'}</a></nav></div></div>`}
function pgMeusPedidos(){const my=LS.get('fr_my',[]);const os=my.map(id=>S.data.pedidos.find(o=>o.id===id)).filter(Boolean);
 return`<div class="wrap" style="max-width:860px"><div class="sec-title"><h2>Meus pedidos</h2></div>${os.length?`<div class="card">${os.map(o=>`<a class="row" href="#pedido-${o.id}" style="padding:14px 16px;border-bottom:1px solid var(--line)"><div class="grow"><b>#${o.id}</b><div class="small muted">${fdt(o.data)} · ${o.itens.length} item(ns)</div></div>${stBadge(o.status)}<b>${brl(o.total)}</b></a>`).join('')}</div>`:'<p class="muted">Nenhum pedido neste aparelho.</p>'}
 <div class="card widget" style="margin-top:16px"><h4>Buscar pedido</h4><form class="form" onsubmit="return buscaPedido(this)"><label class="fl w3">Número do pedido<input name="id" required placeholder="FF12345678"></label><label class="fl w3">E-mail da compra<input name="email" type="email" required></label><div class="fl"><button class="btn">Consultar</button></div></form></div></div>`}
async function buscaPedido(f){const id=f.id.value.trim().toUpperCase().replace('#','');try{let o=S.data.pedidos.find(x=>x.id===id&&x.cliente.email.toLowerCase()===f.email.value.trim().toLowerCase());if(!o&&CFG.API){o=await api('GET',`/api/orders/${id}?email=${encodeURIComponent(f.email.value.trim())}`);S.data.pedidos.unshift(o)}if(!o)throw new Error('Pedido não encontrado');const my=LS.get('fr_my',[]);if(!my.includes(id)){my.unshift(id);LS.set('fr_my',my)}location.hash='pedido-'+id}catch(e){toast(e.message)}return false}
function pgAdd(id){const p=S.data.produtos.find(x=>x.id===id);setTimeout(()=>{if(!p){location.hash='loja';return}if(varsOf(p).length){location.hash='produto-'+id;return}addCart(id,1);location.hash='carrinho'},10);return''}
function renderMain(){const h=curRoute;const[r,...rest]=h.split('-');const a=rest.join('-');clearTimeout(pollT);
 const html=r==='inicio'?pgHome():r==='cat'?pgCat(a):r==='post'?pgPost(a):r==='videos'?pgVideos():r==='radio'?pgRadio():r==='loja'?pgLoja():r==='produto'?pgProduto(a):r==='carrinho'?pgCarrinho():r==='checkout'?pgCheckout():r==='pedido'?pgPedido(a):r==='gestao'?pgPainel():r==='busca'?pgBusca():r==='oracao'?pgOracao():r==='contato'?pgContato():r==='colunas'?pgColunas():r==='tag'?pgTag(a):r==='meuspedidos'?pgMeusPedidos():r==='conta'?pgConta(a):r==='privacidade'?pgPrivacidade():r==='add'?pgAdd(a):r==='redes'?pgRedes():pg404();
 if(r!=='conta')S.mePed=0;setTimeout(()=>{glBalance();if(document.fonts)document.fonts.ready.then(glBalance)},60);$('#main').innerHTML=(r!=='gestao'&&r!=='add'?adSlot('topo'):'')+(r!=='inicio'&&r!=='gestao'&&r!=='add'?navBar(r,a):'')+(STORE_R.includes(r)?storeBar(r):'')+html;carMount();if((r==='inicio'||r==='redes'||r==='videos')&&!S.soc.loaded)loadSocial();if(r==='checkout')mountCardBrick().catch(e=>console.error(e))}
function renderAll(){renderHeader(curRoute);renderMain();renderFooter();renderPlayer();renderAdMob();$('#modelos-fab').classList.toggle('hide',!(ST().seletorPublico||S.adm.logged));document.body.classList.toggle('adm-mode',curRoute==='gestao');renderWA()}
const TIT0=document.title;
function route(){const prev=curRoute;curRoute=(location.hash||'#inicio').slice(1)||'inicio';if(!curRoute.startsWith('post-'))document.title=TIT0;renderAll();if(prev!==curRoute)window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{closeDrawer();route()});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.chips button,.paytabs button,.icobtn,.gh-menu,.car-nav,.pbtn,.adm-nav button,.car-thumbs button,.lay-opt,.pal button');if(!b)return;const r=b.getBoundingClientRect();const d=Math.max(r.width,r.height)*2.2;const sp=document.createElement('span');sp.className='rip';sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),650)});
setInterval(()=>{if(!$('#modal').classList.contains('on'))renderPlayer()},60000);
(async()=>{await DB.load();document.documentElement.dataset.hv=LS.get('fr_hv',null)||ST().cabecalho||'a';const look=LS.get('fr_look2',null);document.documentElement.dataset.layout=(look&&look.l)||ST().layout;document.documentElement.dataset.palette=(look&&look.p)||ST().paleta;
 try{const a=sessionStorage.getItem('fr_adm');if(a&&!CFG.API){const u=JSON.parse(a);if(u&&u.email){S.adm.logged=true;setAdmUser(u)}}}catch(e){}
 if(CFG.API&&S.adm.token){try{await DB.adminLoad();S.adm.logged=true;setAdmUser(LS.get('fr_admu',{papel:'admin',nome:'Administrador'}))}catch(e){S.adm.token=null;LS.set('fr_tok',null)}}
 route()})();
