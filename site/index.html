<style>
/* ===================== PALETAS ===================== */
:root,[data-palette="farol"]{--pri:#B5162E;--pri-d:#6E0D1C;--acc:#F39A30;--acc-t:#2a1200;--bg:#FBF7F5;--surf:#fff;--txt:#23141A;--mut:#6E5C60;--line:#F0E3DF;--ok:#16A34A;--bad:#DC2626;--warn:#D97706;--brand:linear-gradient(120deg,#F39A30,#E2622A 45%,#B5162E 80%,#A51A33)}
[data-palette="azul"]{--pri:#0B3D6B;--pri-d:#072A4A;--acc:#F2A900;--acc-t:#1b1400;--bg:#F5F7FA;--surf:#fff;--txt:#14202E;--mut:#5C6B7D;--line:#E1E6ED;--ok:#16A34A;--bad:#DC2626;--warn:#D97706}
[data-palette="vinho"]{--pri:#6D1A36;--pri-d:#4A0F23;--acc:#C9A227;--acc-t:#1d1500;--bg:#FBF7F4;--surf:#fff;--txt:#2A1A1F;--mut:#7A6268;--line:#EEE2DF}
[data-palette="oliva"]{--pri:#3E5B2E;--pri-d:#2A3F1E;--acc:#D98E04;--acc-t:#1e1300;--bg:#F7F6F0;--surf:#fff;--txt:#1F2A18;--mut:#66705C;--line:#E4E3D6}
[data-palette="ceu"]{--pri:#1F7AB8;--pri-d:#155A8A;--acc:#F06B4F;--acc-t:#fff;--bg:#F3F8FC;--surf:#fff;--txt:#10283A;--mut:#56708A;--line:#DDE8F1}
[data-palette="coral"]{--pri:#FE2A39;--pri-d:#C9111F;--acc:#1A1A1A;--acc-t:#fff;--bg:#F6F6F6;--surf:#fff;--txt:#151515;--mut:#666;--line:#E5E5E5}
[data-palette="noite"]{--pri:#4FA3FF;--pri-d:#0F2A4D;--acc:#FFC53D;--acc-t:#1b1400;--bg:#0D131E;--surf:#151D2B;--txt:#E7EDF6;--mut:#93A3B8;--line:#24304280}
[data-palette="noite"] .mainnav,[data-palette="noite"] .topbar{background:#0A1A30}

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;padding-bottom:84px}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--hfont,Figtree),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.2;margin:0 0 .4em}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn.acc{background:var(--acc);color:var(--acc-t)}.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pri)}
[data-palette="noite"] .chip{color:var(--acc)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--txt)}
.badge.ok{background:#DCFCE7;color:#166534}.badge.warn{background:#FEF3C7;color:#92400E}.badge.bad{background:#FEE2E2;color:#991B1B}.badge.info{background:#DBEAFE;color:#1E40AF}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--mut)}.small{font-size:13px}.row{display:flex;gap:12px;align-items:center}.grow{flex:1}
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.sec-title{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--pri);margin:34px 0 18px;padding-bottom:6px}
.sec-title h2{font-size:20px;margin:0}.sec-title a{font-size:13px;font-weight:700;color:var(--pri)}
.thumb{aspect-ratio:16/9;object-fit:cover;width:100%;border-radius:10px;background:var(--line)}
.icon{width:20px;height:20px;fill:currentColor;flex:none}
.hide{display:none!important}

/* ===================== HEADER CLÁSSICO ===================== */
.topbar{background:var(--pri-d);color:#fff;font-size:12.5px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;height:34px}
.topbar .soc{display:flex;gap:12px}.topbar .soc .icon{width:16px;height:16px}
.brandrow .wrap{display:flex;align-items:center;gap:20px;padding-top:16px;padding-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--hfont,Merriweather),serif;font-weight:900;font-size:26px;color:var(--pri)}

.logo .lg-n{display:flex;align-items:flex-end;gap:6px}.logo em{font-style:normal;font-family:Inter;font-weight:800;font-size:12px;letter-spacing:.22em;color:var(--acc);line-height:1}
[data-palette="farol"] .logo em{color:#E2622A}[data-palette="noite"] .wm,footer.ft .wm{background:#fff}.logo small{margin-top:5px}
[data-palette="farol"] .mainnav{background:var(--brand)}[data-palette="farol"] .verse,[data-palette="farol"] .shop-banner,[data-palette="farol"] .mn-live{background:var(--brand)}
[data-palette="farol"] .verse cite,[data-palette="farol"] .shop-banner .chip{color:#FFE3BD!important}[data-palette="farol"] .shop-banner .btn.acc{background:#fff;color:var(--pri)}[data-palette="farol"] .mn-live .pbtn{background:#fff!important;color:var(--pri)!important}
.mn-side .search{flex:none}.logo small{display:block;font-family:Inter;font-size:11px;font-weight:500;color:var(--mut);letter-spacing:.02em}
.search{flex:1;max-width:420px;display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surf)}
.search input{flex:1;border:0;padding:9px 16px;background:transparent;outline:0}.search button{border:0;background:transparent;padding:0 14px;cursor:pointer;color:var(--mut)}
.hdr-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.cartbtn{position:relative;padding:9px;border-radius:99px;border:1px solid var(--line);background:var(--surf);cursor:pointer;display:flex}
.cartbtn b{position:absolute;top:-4px;right:-4px;background:var(--acc);color:var(--acc-t);font-size:11px;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center}
.mainnav{background:var(--pri);color:#fff;position:sticky;top:0;z-index:30}
.mainnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.mainnav a{padding:12px 14px;font-weight:700;font-size:13.5px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.mainnav a:hover,.mainnav a.on{background:rgba(255,255,255,.14)}
.mainnav a.shop{background:var(--acc);color:var(--acc-t)}
.ticker{background:var(--surf);border-bottom:1px solid var(--line);font-size:13.5px;overflow:hidden}
.ticker .wrap{display:flex;align-items:center;gap:12px;height:38px}
.ticker b{background:var(--bad);color:#fff;padding:3px 10px;border-radius:4px;font-size:11px;letter-spacing:.06em;flex:none}
.ticker .tk{overflow:hidden;white-space:nowrap;flex:1;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker .tk span{display:inline-block;animation:tk 60s linear infinite;padding-left:100%}
.ticker .tk a{margin-right:40px}.ticker .tk a:before{content:"● ";color:var(--pri)}
@keyframes tk{to{transform:translateX(-100%)}}

/* HOME CLÁSSICO */
.home-top{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:24px}
.ht-cta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.ht-c{display:flex;gap:12px;align-items:flex-start;padding:16px;transition:transform .2s,box-shadow .2s}.ht-c:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08)}.ht-c>span{font-size:28px}.ht-c p{margin:4px 0 0}
.hero-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.hero-big{position:relative;border-radius:12px;overflow:hidden;min-height:400px;color:#fff;display:flex;align-items:flex-end}
.hero-big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-big:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.82))}
.hero-big .tx{position:relative;z-index:1;padding:22px}.hero-big h2{font-size:26px}.hero-big .chip{color:var(--acc)}
.hero-side{display:grid;gap:14px}
.mini{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.mini img{aspect-ratio:4/3;object-fit:cover;border-radius:8px}.mini h3{font-size:15px;margin:2px 0 0}
.pcard h3{font-size:17px;margin:8px 0 6px}.pcard p{margin:0;color:var(--mut);font-size:14px}
.pcard:hover h3,.mini:hover h3,.lst:hover h3{color:var(--pri)}
.side>*{margin-bottom:18px}
.widget{padding:18px}.widget h4{font-family:Inter;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:12px}
.verse{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;border:0}
.verse q{font-family:var(--hfont,Merriweather),serif;font-size:17px;line-height:1.5;display:block;quotes:"“" "”"}
.verse cite{display:block;margin-top:10px;font-style:normal;font-weight:700;color:var(--acc)}
.verse h4{color:rgba(255,255,255,.75)}
.radiocard{padding:18px;display:flex;flex-direction:column;gap:10px}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--bad);letter-spacing:.06em}
.live-dot:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.rank{counter-reset:r;list-style:none;padding:0;margin:0}
.rank li{counter-increment:r;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.rank li:before{content:counter(r);font-family:var(--hfont,Merriweather),serif;font-size:24px;color:var(--pri);line-height:1;min-width:20px}

/* ===================== LAYOUT REVISTA ===================== */
[data-layout="revista"]{--hfont:"Playfair Display",Georgia,serif}
.rv-head{background:var(--surf);border-bottom:1px solid var(--line)}
.rv-head .top{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:12.5px;color:var(--mut);border-bottom:1px solid var(--line)}
.rv-head .brand{text-align:center;padding:22px 0 14px}
.rv-head .brand .logo{justify-content:center}.rv-head .brand .lg-c{width:64px;height:64px}.rv-head .brand .wm{height:44px}.rv-head .brand em{font-size:15px}
.rv-nav{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;padding-bottom:10px}
.rv-nav a{padding:8px 12px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid transparent}
.rv-nav a:hover,.rv-nav a.on{border-color:var(--acc)}
.rv-nav a.shop{color:var(--pri);font-weight:800}
.rv-hero{position:relative;min-height:520px;display:flex;align-items:flex-end;color:#fff;margin-top:0}
.rv-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rv-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.15))}
.rv-hero .tx{position:relative;z-index:1;max-width:680px;padding:48px 0}
.rv-hero h1{font-size:46px;margin:12px 0}.rv-hero p{font-size:18px;opacity:.9}
.rv-hero .chip{background:var(--acc);color:var(--acc-t);padding:4px 10px;border-radius:3px}
.rv-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:22px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.rv-row>*{scroll-snap-align:start}
.rv-card img{aspect-ratio:3/4;object-fit:cover;border-radius:4px}
.rv-card h3{font-size:21px;margin:10px 0 6px}
.rv-quote{text-align:center;padding:60px 20px;margin:40px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rv-quote q{font-family:"Playfair Display",serif;font-size:30px;font-style:italic;max-width:780px;display:block;margin:0 auto;quotes:"“" "”"}
.rv-quote cite{display:block;margin-top:14px;font-style:normal;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--pri);font-weight:700}
[data-layout="revista"] .sec-title{border-bottom:1px solid var(--txt);justify-content:center;position:relative}
[data-layout="revista"] .sec-title h2{font-size:28px;font-style:italic}
[data-layout="revista"] .sec-title a{position:absolute;right:0}
[data-layout="revista"] .card,[data-layout="revista"] .thumb{border-radius:4px}
[data-layout="revista"] .btn{border-radius:2px;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.rv-feature{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.rv-feature img{aspect-ratio:4/3;object-fit:cover;border-radius:4px}.rv-feature h2{font-size:34px}

/* ===================== LAYOUT MINIMAL / APP ===================== */
[data-layout="minimal"]{--hfont:"Space Grotesk"}
[data-layout="minimal"] body{padding-left:260px}
.mn-side{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--surf);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;z-index:40;overflow-y:auto}
.mn-side .logo{margin-bottom:14px}.mn-side .lg-c{width:40px;height:40px}.mn-side .wm{height:22px}.mn-side .logo small{display:none}
.mn-side nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut)}
.mn-side nav a:hover,.mn-side nav a.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
[data-palette="noite"] .mn-side nav a.on{color:#fff}
.mn-side .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 12px 4px;font-weight:700}
.mn-top{display:none}
.mn-head{display:flex;align-items:center;gap:14px;padding:18px 0}
.mn-feed{display:grid;grid-template-columns:1fr 320px;gap:28px}
.lst{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:16px;align-items:center}
.lst img{aspect-ratio:16/10;object-fit:cover;border-radius:10px}.lst h3{font-size:18px;margin:4px 0}
.lst p{margin:0;font-size:14px;color:var(--mut)}
[data-layout="minimal"] .card{border-radius:16px}
[data-layout="minimal"] .btn{border-radius:99px}
[data-layout="minimal"] .sec-title{border:0}
[data-layout="minimal"] .sec-title h2{font-size:22px}
.mn-live{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;border:0;padding:20px;display:flex;gap:16px;align-items:center}
.tabsbar{display:none}

/* ===================== POST ===================== */
.post{display:grid;grid-template-columns:1fr 320px;gap:32px;margin-top:28px}
.post h1{font-size:36px}.post .lead{font-size:19px;color:var(--mut);margin:0 0 16px}
.post .meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--mut);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:18px}
.post .body p{font-size:17.5px;line-height:1.75;margin:0 0 18px}
.share{display:flex;gap:8px;margin-left:auto}.share a,.share button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;color:#fff}
.share .icon{width:16px;height:16px}
.yt-ph{aspect-ratio:16/9;border-radius:12px;background:#000;color:#fff;display:grid;place-items:center;text-align:center;padding:20px;position:relative;overflow:hidden}
.yt-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.yt-ph .pl{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:#FF0000;display:grid;place-items:center}
iframe.yt{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}

/* ===================== LOJA ===================== */
.shop-banner{border-radius:14px;padding:30px;color:#fff;background:linear-gradient(120deg,var(--pri),var(--pri-d));display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px;flex-wrap:wrap}
.shop-banner h2{font-size:28px;margin:0}.shop-banner p{margin:6px 0 0;opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.chips button{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.prod{overflow:hidden;display:flex;flex-direction:column;position:relative}
.prod img{aspect-ratio:1;object-fit:cover;width:100%}
.prod .in{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h3{font-family:Inter;font-size:15px;font-weight:600;margin:0}
.price{font-size:20px;font-weight:800;color:var(--txt)}.old{text-decoration:line-through;color:var(--mut);font-size:13px;margin-right:6px}
.off{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;padding:4px 8px;border-radius:6px}
.pix-tag{font-size:12.5px;color:var(--ok);font-weight:600}
.prod-page{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
.prod-page img{border-radius:14px;aspect-ratio:1;object-fit:cover}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surf);width:34px;cursor:pointer;font-size:17px}.qty span{min-width:36px;display:grid;place-items:center;font-weight:700}
.cart-line{display:grid;grid-template-columns:72px 1fr auto auto;gap:14px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.cart-line img{border-radius:8px;aspect-ratio:1;object-fit:cover}
.sum{padding:20px;position:sticky;top:60px}.sum .ln{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px}
.sum .tot{font-size:20px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.two{display:grid;grid-template-columns:1fr 360px;gap:28px;margin-top:24px;align-items:start}
.paytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.paytabs button{border:2px solid var(--line);background:var(--surf);border-radius:10px;padding:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13.5px}
.paytabs button.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--surf))}
.pixbox{text-align:center;padding:24px}.pixbox #qr{display:inline-block;padding:12px;background:#fff;border-radius:10px;margin:12px auto}
.pixbox textarea{width:100%;font-family:monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);resize:none}

/* ===================== FORMS ===================== */
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--mut);grid-column:span 6}
.fl.w3{grid-column:span 3}.fl.w2{grid-column:span 2}.fl.w4{grid-column:span 4}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surf);color:var(--txt);font-weight:400;font-size:14.5px;outline:0}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.fl.ck{flex-direction:row;align-items:center;gap:8px;color:var(--txt)}.fl.ck input{width:18px;height:18px}
.imgprev{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* ===================== PLAYER ===================== */
#player{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--pri-d);color:#fff;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
#player .wrap{display:flex;align-items:center;gap:14px;height:72px}
#player .pbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-t);cursor:pointer;display:grid;place-items:center;flex:none}
#player .pbtn .icon{width:24px;height:24px}
#player .info{min-width:0;flex:1}#player .info b{display:block;font-size:15px}
#player .info span{font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#player input[type=range]{width:110px;accent-color:var(--acc)}
#player .watch{background:#FF0000;color:#fff}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:6px}.eq i{width:3px;background:var(--acc);animation:eq .8s infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{from{height:3px}to{height:14px}}
[data-layout="minimal"] #player{left:276px;right:16px;bottom:14px;border-radius:18px}
[data-layout="revista"] #player{color:#fff}

/* ===================== MODAL / TOAST / SELETOR ===================== */
#modal{position:fixed;inset:0;background:rgba(5,10,20,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--surf);border-radius:16px;max-width:860px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
#modal .x{position:absolute;top:10px;right:12px;border:0;background:var(--line);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#111;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#modelos-fab{position:fixed;right:16px;bottom:92px;z-index:60;border:0;border-radius:99px;padding:12px 16px;background:var(--acc);color:var(--acc-t);font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.lay-opt{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--surf);text-align:left}
.lay-opt.on{border-color:var(--pri)}
.lay-opt svg{width:100%;height:auto;border-radius:6px;background:var(--bg)}
.pal{display:flex;flex-wrap:wrap;gap:10px}
.pal button{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surf);cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.pal button.on{border-color:var(--txt)}
.sw{display:flex}.sw i{width:16px;height:22px}.sw i:first-child{border-radius:5px 0 0 5px}.sw i:last-child{border-radius:0 5px 5px 0}

/* ===================== ADMIN ===================== */
.adm{display:grid;grid-template-columns:230px 1fr;gap:24px;margin-top:24px;align-items:start}
.adm-nav{padding:10px;position:sticky;top:60px}
.adm-nav button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-align:left;color:var(--mut)}
.adm-nav button.on,.adm-nav button:hover{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
[data-palette="noite"] .adm-nav button.on{color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px}.kpi span{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}.kpi b{display:block;font-size:24px;margin-top:4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.tblwrap{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding:10px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div:hover:after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:11px;padding:3px 6px;border-radius:4px;white-space:nowrap}
.hbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.hbar i{display:block;height:100%;background:var(--pri)}
.notice{padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--acc) 18%,var(--surf));border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);font-size:13.5px}

/* ===================== FOOTER ===================== */
footer.ft{background:var(--pri-d);color:#fff;margin-top:56px;padding:40px 0 24px;font-size:14px}
footer.ft .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}
footer.ft h4{font-family:Inter;font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
footer.ft a{display:block;padding:3px 0;opacity:.9}footer.ft a:hover{opacity:1;text-decoration:underline}
footer.ft a.logo{display:flex;opacity:1}footer.ft .logo{color:#fff}footer.ft .logo small{color:rgba(255,255,255,.6)}
footer.ft .cp{border-top:1px solid rgba(255,255,255,.15);margin-top:28px;padding-top:16px;font-size:12.5px;opacity:.7;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
[data-layout="minimal"] footer.ft{background:transparent;color:var(--txt);border-top:1px solid var(--line)}
[data-layout="minimal"] footer.ft .logo{color:var(--pri)}

/* ===================== RESPONSIVO ===================== */
@media (max-width:960px){
 .home-top,.post,.two,.mn-feed,.adm{grid-template-columns:1fr}
 .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .prod-page,.rv-feature{grid-template-columns:1fr}
 footer.ft .cols{grid-template-columns:1fr 1fr}
 .adm-nav{position:static;display:flex;overflow-x:auto}.adm-nav button{white-space:nowrap;width:auto}
 [data-layout="minimal"] body{padding-left:0;padding-top:58px}
 .mn-side{display:none}
 .mn-top{display:flex;position:fixed;top:0;left:0;right:0;height:58px;z-index:40;background:var(--surf);border-bottom:1px solid var(--line);align-items:center;padding:0 14px;gap:12px}
 .mn-top .lg-c{width:34px;height:34px}.mn-top .wm{height:20px}.mn-top .logo small{display:none}
 [data-layout="minimal"] #player{left:10px;right:10px;bottom:72px}
 [data-layout="minimal"] body{padding-bottom:160px}
 [data-layout="minimal"] .tabsbar{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--surf);border-top:1px solid var(--line);z-index:45}
 .tabsbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--mut);gap:2px}
 .tabsbar a.on{color:var(--pri)}
 [data-layout="minimal"] #modelos-fab{bottom:160px}
}
@media (max-width:640px){
 body{font-size:14.5px}
 .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr;gap:12px}
 .hero-grid{grid-template-columns:1fr}.hero-big{min-height:300px}.hero-big h2{font-size:21px}
 .brandrow .search{display:none}.logo .lg-c{width:38px;height:38px}.wm{height:21px}.logo small{display:none}
 .rv-head .brand .lg-c{width:48px;height:48px}.rv-head .brand .wm{height:30px}
 .topbar .dt{display:none}
 .rv-head .brand .logo{font-size:30px}.rv-hero{min-height:420px}.rv-hero h1{font-size:30px}.rv-quote q{font-size:22px}
 .lst{grid-template-columns:110px 1fr;padding:12px;gap:12px}.lst h3{font-size:15px}.lst p{display:none}
 .post h1{font-size:26px}.post .body p{font-size:16.5px}
 #player .vol,#player .watch .lbl{display:none}
 #player .wrap{gap:10px}
 .cart-line{grid-template-columns:56px 1fr auto}.cart-line .lt{display:none}
 .fl.w3,.fl.w2,.fl.w4{grid-column:span 6}
 .paytabs button{font-size:12px;padding:10px 4px}
 .shop-banner{padding:22px}.shop-banner h2{font-size:22px}
 .kpi b{font-size:19px}
 footer.ft .cols{grid-template-columns:1fr}
}

/* ===================== v2 — ESTILO PORTAL ATUAL (globo-like) ===================== */
html{--hfont:Figtree}
h1,h2,h3,h4{letter-spacing:-.015em}
.sec-title h2{font-weight:800}
#main>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
/* header */
.gh{background:var(--brand,var(--pri));color:#fff;position:sticky;top:0;z-index:35;box-shadow:0 2px 14px rgba(0,0,0,.14)}
.gh-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:70px}
.gh .wm,.drw .dr-h .wm{background:#fff}.gh .wm{height:30px;transition:transform .3s}.gh .logo:hover .wm{transform:scale(1.04)}
.gh-menu{justify-self:start;display:inline-flex;align-items:center;gap:10px;background:transparent;border:0;color:#fff;font-weight:800;letter-spacing:.1em;font-size:13px;cursor:pointer;padding:9px 12px;border-radius:10px;position:relative;overflow:hidden;transition:background .2s}
.gh-menu:hover{background:rgba(255,255,255,.16)}
.gh-right{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.icobtn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;transition:background .2s,transform .18s}
.icobtn:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
.gh .cartbtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:42px;height:42px;place-items:center;display:grid;padding:0;transition:background .2s,transform .18s}
.gh .cartbtn:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
.gh .cartbtn b{background:#fff;color:var(--pri)}
.live-btn{background:#fff!important;color:var(--pri)!important;border-radius:99px!important;padding:10px 18px!important}
.live-btn .eq i{background:var(--pri)}
.gh-search{background:var(--surf);border-bottom:1px solid var(--line);overflow:hidden;max-height:0;transition:max-height .35s ease}
.gh-search.on{max-height:90px}
.gh-search form{display:flex;gap:10px;padding:14px 0}
.gh-search input{flex:1;border:2px solid var(--line);border-radius:99px;padding:12px 20px;font-size:16px;background:var(--bg);outline:0;transition:border-color .2s}
.gh-search input:focus{border-color:var(--pri)}
.gnav{background:var(--surf);border-bottom:1px solid var(--line)}
.gnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.gnav .wrap::-webkit-scrollbar{display:none}
.gnav a{position:relative;padding:14px 13px;font-weight:700;font-size:14px;color:var(--mut);white-space:nowrap;transition:color .2s}
.gnav a:after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--brand,var(--pri));transform:scaleX(0);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.gnav a:hover,.gnav a.on{color:var(--pri)}.gnav a:hover:after,.gnav a.on:after{transform:scaleX(1)}
.gnav a.shop{color:var(--pri)}
[data-palette="noite"] .gnav a:hover,[data-palette="noite"] .gnav a.on{color:#fff}
/* drawer */
#drawer{position:fixed;inset:0;z-index:95;pointer-events:none}
#drawer .ov{position:absolute;inset:0;background:rgba(10,5,8,.5);opacity:0;transition:opacity .3s}
#drawer .drw{position:absolute;left:0;top:0;bottom:0;width:340px;max-width:88vw;background:var(--surf);transform:translateX(-102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto;display:flex;flex-direction:column}
#drawer.on{pointer-events:auto}#drawer.on .ov{opacity:1}#drawer.on .drw{transform:none}
.dr-h{background:var(--brand,var(--pri));padding:20px;display:flex;align-items:center;justify-content:space-between}
.dr-h .wm{height:26px}
.dr-x{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer}
.dr-b{padding:14px}
.dr-b .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:800;margin:16px 10px 6px}
.dr-b a.dl{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:700;font-size:15px;transition:background .2s,transform .2s,color .2s}
.dr-b a.dl:hover{background:color-mix(in srgb,var(--pri) 10%,transparent);color:var(--pri);transform:translateX(4px)}
.dr-b a.dl .icon{color:var(--pri)}
.dr-b a.dl.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.dr-live{margin:4px 0 10px;border-radius:14px;padding:14px;background:color-mix(in srgb,var(--pri) 8%,var(--surf));display:flex;align-items:center;gap:12px}
.dr-live img{width:44px;height:44px;border-radius:50%}
.drw .soc{display:flex;gap:14px;padding:16px 22px;margin-top:auto;color:var(--mut);border-top:1px solid var(--line)}
/* carrossel */
.car{position:relative;border-radius:18px;overflow:hidden;background:#111;touch-action:pan-y;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.car-track{display:flex;transition:transform .75s cubic-bezier(.65,0,.35,1);will-change:transform}
.car-slide{flex:0 0 100%;position:relative;aspect-ratio:21/9;min-height:360px;color:#fff;display:block;overflow:hidden}
.car-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 6.5s ease-out}
.car-slide.on img{transform:scale(1)}
.car-slide:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.88)),linear-gradient(90deg,rgba(0,0,0,.35),transparent 60%)}
.car-tx{position:absolute;left:0;bottom:0;z-index:1;padding:34px 44px 58px;max-width:880px}
.car-tx h2{font-family:var(--hfont),sans-serif;font-size:clamp(23px,3.3vw,42px);font-weight:900;line-height:1.08;margin:12px 0 10px;letter-spacing:-.02em}
.car-tx p{opacity:.92;margin:0;font-size:17px;max-width:680px}
.car-tx>*{opacity:0;transform:translateY(18px);transition:opacity .6s .2s,transform .6s .2s}
.car-slide.on .car-tx>*{opacity:1;transform:none}.car-slide.on .car-tx h2{transition-delay:.3s}.car-slide.on .car-tx p{transition-delay:.42s}
.car-tx .chip{display:inline-block;background:var(--acc);color:var(--acc-t);padding:5px 11px;border-radius:6px}
[data-palette="farol"] .car-tx .chip{background:#fff;color:var(--pri)}
.car-nav{position:absolute;top:50%;z-index:3;width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:28px;line-height:1;cursor:pointer;transform:translateY(-50%) scale(.85);opacity:0;transition:opacity .25s,transform .25s;overflow:hidden}
.car:hover .car-nav{opacity:1;transform:translateY(-50%) scale(1)}
.car-nav:hover{background:#fff;transform:translateY(-50%) scale(1.1)!important}
.car-nav.prev{left:18px}.car-nav.next{right:18px}
.car-dots{position:absolute;right:28px;bottom:24px;z-index:3;display:flex;gap:7px}
.car-dots button{width:10px;height:10px;border-radius:99px;border:0;background:rgba(255,255,255,.5);cursor:pointer;transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s;padding:0}
.car-dots button.on{width:30px;background:#fff}
.car-count{position:absolute;top:18px;right:20px;z-index:3;background:rgba(0,0,0,.45);color:#fff;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.car-prog{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:3;background:rgba(255,255,255,.15)}
.car-prog i{display:block;height:100%;width:0;background:var(--acc)}
[data-palette="farol"] .car-prog i{background:linear-gradient(90deg,#F39A30,#fff)}
.car-prog i.run{animation:prog 6.5s linear forwards}
.car.paused .car-prog i{animation-play-state:paused}
@keyframes prog{to{width:100%}}
.car-thumbs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.car-thumbs button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;font-weight:700;font-size:13px;line-height:1.3;position:relative;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;color:var(--txt)}
.car-thumbs button:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.08)}
.car-thumbs img{width:62px;height:46px;object-fit:cover;border-radius:8px;flex:none}
.car-thumbs button.on{border-color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
.car-thumbs span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.car.full{border-radius:0;box-shadow:none}.car.full .car-slide{aspect-ratio:auto;height:min(78vh,620px)}
.car.full .car-tx{left:max(16px,calc((100vw - 1200px)/2));padding-left:16px}
.expgrid{margin-top:18px;animation:fadeUp .45s both}
.sec-actions{display:flex;gap:8px;align-items:center}
/* feed estilo portal */
.gfeed{display:flex;flex-direction:column}
.gcard{display:grid;grid-template-columns:1fr 290px;gap:26px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}
.gcard:first-child{padding-top:4px}
.gcard .ov{border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:var(--line)}
.gcard .ov img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.gcard:hover .ov img{transform:scale(1.07)}
.gcard h3{font-family:var(--hfont),sans-serif;font-size:24px;font-weight:800;line-height:1.18;margin:6px 0 8px;transition:color .2s}
.gcard:hover h3{color:var(--pri)}
.gcard p{color:var(--mut);margin:0 0 10px;font-size:15.5px}
.gcard .when{font-size:12.5px;color:var(--mut)}
.more{display:flex;justify-content:center;margin:20px 0 4px}
.pcard img{transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.pcard:hover img{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,0,0,.14)}
.mini img{transition:transform .5s}.mini:hover img{transform:scale(1.05)}
.prod{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}.prod:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(0,0,0,.1)}
.prod img{transition:transform .6s}.prod:hover img{transform:scale(1.05)}
.card.lst{transition:transform .25s,box-shadow .25s}.card.lst:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.crumbs{font-size:13px;color:var(--mut);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}.crumbs a{color:var(--pri);font-weight:700}
/* movimento nos botões */
.btn,.chips button,.paytabs button,.adm-nav button,.lay-opt,.pal button,.pbtn,.qty button,.share a,.share button{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s,filter .2s,border-color .2s,color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in srgb,var(--pri) 28%,transparent);filter:none}
.btn.ghost:hover{box-shadow:0 6px 14px rgba(0,0,0,.08);border-color:var(--pri);color:var(--pri)}
.btn:active,.chips button:active,.paytabs button:active,.adm-nav button:active,.pbtn:active,.icobtn:active,.gh-menu:active,.car-thumbs button:active,.lay-opt:active,.pal button:active,.qty button:active,.cartbtn:active{transform:scale(.94)!important}
.chips button:hover,.pal button:hover,.lay-opt:hover{transform:translateY(-2px)}
.share a:hover,.share button:hover{transform:translateY(-3px) scale(1.08)}
.chips button.on,.paytabs button.on,.adm-nav button.on,.pal button.on,.lay-opt.on{animation:pop .38s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.pbtn:hover{transform:scale(1.08)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
#modelos-fab{transition:transform .2s}#modelos-fab:hover{transform:translateY(-3px) rotate(-2deg)}
/* player com arte */
#player .part{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
#player .part.spin{animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#player{background:#1c0c12}
[data-palette="farol"] #player{background:linear-gradient(90deg,#2a0d15,#5a0b1a)}
#modal .box{animation:fadeUp .3s both}
@media (max-width:960px){.gcard{grid-template-columns:1fr 220px}.car-slide{aspect-ratio:16/9}}
@media (max-width:640px){
 .gh-in{height:60px}.gh .wm{height:21px}.gh-menu span,.live-btn{display:none!important}.gh-right{gap:6px}.icobtn,.gh .cartbtn{width:38px;height:38px}
 .gnav .wrap{justify-content:flex-start}
 .car{border-radius:14px}.car-slide{aspect-ratio:4/5;min-height:0}.car.full .car-slide{height:auto;aspect-ratio:4/5}
 .car-tx{padding:20px 20px 46px}.car-tx p{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .car-nav{opacity:1;width:38px;height:38px;font-size:22px;top:38%;transform:translateY(-50%)}.car-nav.prev{left:10px}.car-nav.next{right:10px}
 .car-dots{right:auto;left:20px;bottom:20px}.car-thumbs{display:none}
 .gcard{grid-template-columns:1fr 110px;gap:14px;padding:16px 0;align-items:start}.gcard h3{font-size:17px}.gcard p{display:none}.gcard .ov{aspect-ratio:1}
 #player .part{width:36px;height:36px}#player .lbl{display:none}#player .info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #modelos-fab{padding:10px 12px;bottom:150px}#modelos-fab span{display:none}
 .rv-nav a{white-space:nowrap}.rv-nav{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.rv-head .top span{font-size:11.5px}
}

/* ===================== REDES SOCIAIS ===================== */
.soc-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.sbox{padding:18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.sb-h{display:flex;align-items:center;gap:12px}
.sb-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.sb-ic .icon{width:26px;height:26px}
.sb-ic.yt{background:#FF0000}.sb-ic.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.sb-h b{display:block;font-size:16px}.sb-h span{font-size:13px;color:var(--mut)}
.btn.yt{background:#FF0000}.btn.ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.yt-main{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;background:#000;display:block}

.yt-main:hover img{transform:scale(1.05)}

.yt-main .pl .icon{width:32px;height:32px}

.yt-main .lv:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.yt-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.yt-list a{font-size:13px;font-weight:700;line-height:1.3}
.yt-list img{aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:6px;transition:transform .4s}
.yt-list a:hover img{transform:translateY(-3px)}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ig-grid a{position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;background:var(--line);display:block}
.ig-grid img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ig-grid a:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .3s}
.ig-grid a:hover img{transform:scale(1.08)}.ig-grid a:hover:after{background:rgba(0,0,0,.18)}
.ig-grid .tp{position:absolute;top:6px;right:6px;z-index:1;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.ig-grid .tp .icon{width:18px;height:18px}
.ig-emb{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ig-emb iframe{width:100%;height:560px;border:1px solid var(--line);border-radius:12px;background:#fff}
@media (max-width:960px){.soc-grid{grid-template-columns:1fr}}
@media (max-width:640px){.yt-list{grid-template-columns:1fr 1fr}.yt-list a:nth-child(3){display:none}.yt-main .pl{width:56px;height:56px}}

/* banner da loja — primeira tela */

.rv-shop{margin:0 auto;max-width:1200px;padding:0 16px}

.gl-row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px;padding-top:20px;border-top:1px solid #e3e3e3}
.gl-card{margin-bottom:24px}.gl-card:last-child{margin-bottom:0}
.gl-im{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:16/10;background:var(--line)}
.gl-im img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.gl-card a:hover .gl-im img{transform:scale(1.06)}
.gl-tag{position:absolute;left:8px;top:8px;background:#C8102E;color:#fff;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:4px}
.gl-card h3{font-family:var(--hfont),sans-serif;font-size:19px;font-weight:800;line-height:1.22;margin:9px 0 6px;letter-spacing:-.01em}
.gl-card.sm h3{font-size:16px}
.gl-card a:hover h3{text-decoration:underline;text-underline-offset:3px}
.gl-bl{list-style:none;padding:0;margin:0;font-size:13px;color:var(--mut);line-height:1.4}
.gl-bl li{position:relative;padding-left:11px;margin-top:4px}.gl-bl li:before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:currentColor}
.gl-bl a:hover{color:var(--pri)}
.gl-shop{display:block;margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid #e3e3e3}
.gl-kick{display:inline-block;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--brand,var(--pri));padding:3px 8px;border-radius:4px}
.gl-shop h3{color:var(--pri);font-family:var(--hfont),sans-serif;font-size:19px;font-weight:800;line-height:1.22;margin:8px 0 6px}
.gl-shop:hover h3{text-decoration:underline}
.gl-radio{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;background:#fff;border:1px solid #e3e3e3;margin-bottom:24px}
[data-palette="noite"] .gl-radio{background:var(--surf);border-color:var(--line)}
.gl-radio img{width:46px;height:46px;border-radius:50%}
/* espaçamento padronizado dos banners */
.ad{margin:32px auto;padding:0}
.ad-topo{margin:20px auto 4px;padding:0 16px}
.ad-rodape{margin:40px auto 0;padding:0 16px}
.side .ad,.gl .ad{margin:0 auto 24px}
.post .body .ad{margin:28px auto}
.wrap>.ad:first-child{margin-top:20px}
.ad .ad-l{margin-bottom:6px}
.ad-home1{margin:36px auto 8px}
.ad+.sec-title,.ad+.home-top{margin-top:26px}
@media (max-width:960px){.gl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.gl-c1{grid-column:1/-1;padding-right:0}.gl-c2{padding:24px 12px 0 0;border-left:0}.gl-c3{padding:24px 0 0 12px}}
@media (max-width:640px){
 .gb-in{height:56px}.gb-h .logo .wm{height:21px}.gb-menu span:last-child,.gb-lk span:not(.eq){display:none}.gb-lk{padding:8px}.gb-lk+.gb-lk{border-left:0}.gb-r .gb-acc,.gb-r .gb-live{display:none}
 .gb-nav .wrap{justify-content:flex-start}.gb-info .gb-dt{display:none}
 [data-layout="classico"] .storebar{top:56px}
 .gl{grid-template-columns:1fr;margin-top:14px}.gl-c2,.gl-c3{padding:20px 0 0;border-left:0;border-top:1px solid #e3e3e3;margin-top:20px}
 .gl-row3{grid-template-columns:1fr 1fr}.gl-row3 .gl-card:nth-child(3){display:none}
 .gl .car-slide{aspect-ratio:4/5}.ad{margin:24px auto}.ad-topo{margin:12px auto 0;padding:0 12px}
}

/* ===================== RDS + barra da rádio recolhível ===================== */
#player .part{object-fit:cover}
#player .part.art{border-radius:10px;animation:none;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
#player .np{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .np i{font-style:normal;color:var(--acc);font-weight:700}
#player .pmin{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:inherit;cursor:pointer;font-size:16px;flex:none;transition:background .2s,transform .2s}
#player .pmin:hover{background:rgba(255,255,255,.26);transform:translateY(2px)}
#player.mini{left:16px;right:auto;bottom:16px;width:max-content;max-width:calc(100vw - 100px);border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#player.mini{display:block}#player.mini .wrap{height:auto;padding:6px;gap:8px;max-width:none;width:max-content;margin:0}
#player.mini .pbtn{width:44px;height:44px}
#player.mini .info,#player.mini .vol,#player.mini .watch,#player.mini .ghost,#player.mini .pmin{display:none}
#player.mini .part{width:40px;height:40px}
#player .pexp{display:none;border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
#player.mini .pexp{display:inline-flex;align-items:center;gap:6px}
#player.mini .pexp b{max-width:180px;overflow:hidden;text-overflow:ellipsis;font-weight:700}
body.player-mini{padding-bottom:24px}
body.player-mini #modelos-fab{bottom:86px}
body.player-mini #wa-fab{bottom:20px}body.player-mini #wa{bottom:92px}
body.player-mini .ad-mob{bottom:84px}
[data-layout="minimal"] #player.mini{left:276px;right:auto}
.gb-info .np-h{color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.gb-info .np-h i{font-style:normal;color:var(--pri)}
@media (max-width:640px){#player.mini{left:10px;bottom:12px}#player.mini .pexp b{max-width:120px}[data-layout="minimal"] #player.mini{left:10px;bottom:72px}}

/* ===================== 3 OPÇÕES DE CABEÇALHO/GRADE (Modelo 1) ===================== */
.gl-k2{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:10px}
[data-hv="b"] .gl-k2{display:none}
/* --- A: Faixa Farol — logo à esquerda, editorias na mesma linha, títulos escuros com chapéu colorido */
.hv-strip{height:4px;background:var(--brand,var(--pri))}
.hva-in{display:flex;align-items:center;gap:18px;height:68px}
.hva-in .logo{flex:none}.hva-in .logo .wm{height:28px}
.hva-nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.hva-nav::-webkit-scrollbar{display:none}
.hva-nav a{padding:8px 11px;font-weight:700;font-size:14px;white-space:nowrap;border-radius:8px;position:relative;transition:background .2s}
.hva-nav a:hover,.hva-nav a.on{background:color-mix(in srgb,currentColor 10%,transparent)}
.hva-nav a:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:1px}
.hva-r .gb-lk span{display:none}.hva-r .gb-lk+.gb-lk{border-left:0}
.hva-live{background:var(--brand,var(--pri))!important;color:#fff!important;border-radius:99px!important;padding:9px 16px!important;font-weight:800}
.hva-live .icon{color:#fff!important}.hva-live span{display:inline!important}.hva-live .eq i{background:#fff}
[data-hv="a"] .gl-card h3,[data-hv="a"] .gl-shop h3{color:var(--txt)!important}
[data-hv="a"] .gl-card a:hover h3{color:var(--pri)!important;text-decoration:none}
/* --- B: Farol Noturno — faixa escura com logo branca ao centro, editorias em barra degradê, títulos coloridos */
.hvb{background:#1c0c12!important;border-bottom:0!important}
.hvb .gb-menu,.hvb .gb-lk{color:#fff}.hvb .gb-menu:hover,.hvb .gb-lk:hover{background:rgba(255,255,255,.1);color:#fff}
.hvb .gb-dots i{background:#F39A30}.hvb .gb-lk .icon{color:#F39A30}.hvb .gb-lk+.gb-lk{border-color:rgba(255,255,255,.15)}
.hvb .logo .wm{background:#fff!important;height:32px}
.hvb-nav{background:var(--brand,var(--pri))!important;border:0!important}
.hvb-nav a{color:#fff!important;text-transform:uppercase!important;font-size:12.5px!important;letter-spacing:.08em;opacity:.88}
.hvb-nav a:hover,.hvb-nav a.on{opacity:1}
[data-hv="b"] .gl-c2,[data-hv="b"] .gl-c3{border-left:0}[data-hv="b"] .gl-im{border-radius:14px}
[data-hv="b"] .gl .car,[data-hv="b"] .gl-bar{border-radius:14px}[data-hv="b"] .gl-bar{border-radius:0 0 14px 14px}
/* --- C: Farol Cartões — logo + busca grande, editorias em pílulas, notícias em cartões com faixa de cor */
.hvc-in{display:flex;align-items:center;gap:16px;height:70px}
.hvc-in .logo{flex:none}.hvc-in .logo .wm{height:28px}
.hvc-q{flex:1;display:flex;max-width:520px;margin:0 auto;border:2px solid #ececec;border-radius:99px;background:var(--bg);overflow:hidden;transition:border-color .2s}
.hvc-q:focus-within{border-color:var(--pri)}.hvc-q input{flex:1;border:0;background:transparent;padding:10px 18px;outline:0;font-size:14.5px}.hvc-q button{border:0;background:transparent;padding:0 16px;color:var(--pri);cursor:pointer}
.hvc-nav .wrap{gap:8px!important;padding-top:10px;padding-bottom:10px}
.hvc-nav a{padding:7px 14px!important;border-radius:99px;font-size:13.5px!important;text-transform:none!important}
.hvc-nav a:after{display:none}
.hvc-nav a.on{outline:2px solid currentColor}
[data-hv="c"] .gl{gap:20px}[data-hv="c"] .gl-c1,[data-hv="c"] .gl-c2,[data-hv="c"] .gl-c3{padding:0;border:0}
[data-hv="c"] .gl-card{background:var(--surf);border-radius:14px;padding:10px 10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-top:4px solid var(--cc,var(--pri));transition:transform .25s,box-shadow .25s}
[data-hv="c"] .gl-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.09)}
[data-hv="c"] .gl-card h3{color:var(--txt)!important}[data-hv="c"] .gl-row3{border-top:0;padding-top:0}
[data-hv="c"] .gl-shop{background:var(--surf);border-radius:14px;padding:10px 10px 14px;border:0;box-shadow:0 2px 10px rgba(0,0,0,.05);border-top:4px solid var(--pri)}
@media (max-width:960px){.hva-nav{display:none}.hvc-q{display:none}}
@media (max-width:640px){.hva-live span{display:none!important}.hva-live{padding:8px!important}.hvc-in{gap:8px}.hvc-in .logo .wm{height:21px}}

/* ===================== preenchimento de espaços vazios ===================== */
.gl{align-items:start}
.fill-card{display:flex}
.fill-in{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;border:2px dashed color-mix(in srgb,var(--cc,var(--pri)) 45%,transparent);border-radius:12px;padding:20px;min-height:100%;aspect-ratio:auto;background:color-mix(in srgb,var(--cc,var(--pri)) 5%,var(--surf));transition:background .2s,transform .2s}
.fill-card:hover .fill-in{background:color-mix(in srgb,var(--cc,var(--pri)) 11%,var(--surf));transform:translateY(-3px)}
.fill-in span{font-size:30px}.fill-in b{font-size:17px;line-height:1.25;color:var(--cc,var(--pri))}.fill-in small{color:var(--mut);font-size:13px}
.grid.g3>.fill-card{min-height:240px}
.gl-hl{display:block;padding:12px 0;border-top:1px solid #e3e3e3}
[data-hv="c"] .gl-hl{background:var(--surf);border-radius:12px;padding:12px 14px;border:0;border-left:4px solid var(--cc,var(--pri));box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:12px}
.gl-hl span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cc,var(--pri))}
.gl-hl b{display:block;font-size:15.5px;line-height:1.3;margin-top:3px}.gl-hl:hover b{color:var(--pri)}
.gl-box{margin-top:14px;border-radius:12px;padding:16px;background:var(--surf);border:1px solid #e9e9e9}
[data-hv="c"] .gl-box{border:0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.gl-box h4{font-family:Inter;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 10px}
.gl-box .vd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gl-box .vd a{font-size:13px;font-weight:700;line-height:1.3}
.gl-box .vd img{aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:6px}
.gl-box .cl{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.gl-box .cl:first-of-type{border-top:0}
.gl-box .cl .av{width:36px;height:36px;border-radius:50%;background:var(--brand,var(--pri));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}

/* usuários */
.av-u{width:38px;height:38px;border-radius:50%;background:var(--brand,var(--pri));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.adm-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.adm-tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);cursor:pointer;font-weight:700;font-size:13.5px;text-align:left;color:var(--txt);transition:transform .2s,box-shadow .2s,border-color .2s}
.adm-tile span{font-size:22px}.adm-tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.08);border-color:var(--pri)}

nidas entre 18 de novembro e 8 de dezembro.\n\nLançada em 2023 pela missão Portas Abertas e com duração prevista até 2027, a campanha denuncia a violência contra cristãos na África Subsaariana, como assassinatos, ataques a aldeias e o deslocamento forçado de famílias inteiras.\n\nA iniciativa nasceu de alertas feitos por líderes cristãos da região. Um deles é o pastor Barnabas, da Nigéria, que precisou deixar a própria casa e hoje vive em um acampamento para deslocados.\n\nAlém de buscar apoio político, a campanha arrecada recursos para ajuda emergencial, acolhimento de deslocados, órfãos e viúvas e programas de cuidado com o trauma, e convida as igrejas a orar pelo fim da violência.", "fonte": "Portas Abertas Brasil", "fonteUrl": "https://portasabertas.org.br/noticias/cristaos-perseguidos/peticao-desperta-africa-alcanca-um-milhao-de-assinaturas/", "tags": "África, petição, igreja perseguida", "urgente": false, "tipo": "Notícia", "status": "publicado", "autor": "Redação Farol", "legenda": "Abrigos improvisados em acampamento de deslocados na África (imagem ilustrativa). Foto: Wikimedia Commons", "views": 470, "imagem": "https://commons.wikimedia.org/wiki/Special:FilePath/Darfur_IDPs_1_camp.jpg?width=1280", "imagemAlt": "assets/noticias/n7.jpg", "creditoUrl": "https://commons.wikimedia.org/wiki/File:Darfur_IDPs_1_camp.jpg"}, {"id": "n8", "categoria": "Mundo Cristão", "chapeu": "IÊMEN", "data": "2026-11-18T14:00:00-03:00", "titulo": "Conflito no Iêmen agrava a situação dos cristãos no país", "resumo": "Terceiro colocado na Lista Mundial da Perseguição, o país vive guerra, crise humanitária e falta de remédios.", "corpo": "Divisões políticas, combates armados e uma grave crise humanitária têm deixado milhares de iemenitas sem segurança, sem comida e sem acesso a remédios. Para os cristãos do país, o terceiro na Lista Mundial da Perseguição 2026, a situação é ainda mais difícil, segundo a missão Portas Abertas.\n\nParceiros locais comemoraram a libertação de vários cris u. Uma criança de cinco anos morreu de fome e de doenças sem tratamento.\n\nJo Newhouse, porta-voz da missão para a África Subsaariana, pediu que as autoridades reforcem os esforços para libertar os reféns que continuam em poder dos sequestradores. A Nigéria ocupa o 7º lugar na Lista Mundial da Perseguição 2026.", "fonte": "Portas Abertas Brasil", "fonteUrl": "https://portasabertas.org.br/noticias/cristaos-perseguidos/nigeria-17-cristaos-sequestrados-morrem-em-cativeiro/", "tags": "Nigéria, oração, igreja perseguida", "destaque": false, "tipo": "Notícia", "status": "publicado", "autor": "Redação Farol", "legenda": "Vela acesa (imagem ilustrativa). Foto: PetarM / Wikimedia Commons", "views": 700, "imagem": "https://commons.wikimedia.org/wiki/Special:FilePath/Candle_%28Slava_celebration%29.jpg?width=1280", "imagemAlt": "assets/noticias/n10.jpg", "creditoUrl": "https://commons.wikimedia.org/wiki/File:Candle_%28Slava_celebration%29.jpg"}, {"id": "n11", "categoria": "Missões", "chapeu": "BURKINA FASO", "data": "2026-11-15T14:00:00-03:00", "titulo": "Violência obriga famílias cristãs a fugir em Burkina Faso", "resumo": "Estudante que perdeu um ano de aulas após ataques à sua aldeia voltou a estudar com apoio de parceiros da Portas Abertas.", "corpo": "O aumento da violência em Burkina Faso tem obrigado milhares de pessoas, entre elas muitas famílias cristãs, a abandonar suas casas. A missão Portas Abertas contou a história de Odile (nome fictício), uma estudante de 18 anos da província de Kenedougou.\n\nEm 25 de agosto de 2023, extremistas islâmicos atacaram a aldeia dela, e a família fugiu para uma comunidade vizinha. Um mês depois, o novo refúgio também foi atacado e a família se separou: Odile foi morar com um tio em uma cidade próxima.\n\nSem dinheiro para as mensalidades, ela ficou um ano fora da escola, até que parceiros locais da missão passaram a pagar seus estudos por dois anos letivos. Hoje, Odile está no terceiro ano do ensino médio.\n\nDesde 2014, grupos extre /* ===================== PREÇOS, PROMOÇÕES, CUPONS ===================== */
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const inRange=(i,f)=>{const n=Date.now();return(!i||Date.parse(i)<=n)&&(!f||Date.parse(f)+864e5>n)};
function campaignPct(p){return S.data.promocoes.filter(c=>c.ativo&&inRange(c.inicio,c.fim)&&(c.alvo==='todos'||c.alvo==='cat:'+p.categoria||c.alvo==='p:'+p.id)).reduce((m,c)=>Math.max(m,+c.percentual||0),0)}
function priceOf(p){let v=+p.preco;if(p.precoPromo&&+p.precoPromo>0&&+p.precoPromo<v)v=+p.precoPromo;const pc=campaignPct(p);if(pc)v=Math.min(v,+p.preco*(1-pc/100));return r2(v)}
const offPct=p=>Math.round((1-priceOf(p)/p.preco)*100);
function findCoupon(code){return S.data.cupons.find(c=>c.codigo.toUpperCase()===String(code||'').toUpperCase().trim())}
function couponCheck(c,sub){if(!c)return'Cupom não encontrado';if(!c.ativo)return'Cupom inativo';if(c.validade&&Date.parse(c.validade)+864e5<Date.now())return'Cupom expirado';if(c.limite&&c.usos>=c.limite)return'Cupom esgotado';if(c.minimo&&sub<c.minimo)return`Pedido mínimo de ${brl(c.minimo)}`;return''}
function totals(method=S.pay,ship=S.ship,code=S.coupon){
 const s=ST();const items=S.cart.map(l=>{const p=S.data.produtos.find(x=>x.id===l.id);return p?{p,v:l.v||'',key:lk(l),qty:l.qty,unit:priceOf(p),line:r2(priceOf(p)*l.qty)}:null}).filter(Boolean);
 const sub=r2(items.reduce((a,i)=>a+i.line,0));
 let frete=ship==='retirada'?0:(s.freteGratisAcima&&sub>=s.freteGratisAcima?0:+s.frete||0);
 const c=code?findCoupon(code):null;const cErr=code?couponCheck(c,sub):'';let desc=0;
 if(c&&!cErr){if(c.tipo==='percentual')desc=r2(sub*c.valor/100);else if(c.tipo==='fixo')desc=Math.min(sub,+c.valor);else if(c.tipo==='frete')frete=0}
 let base=r2(sub-desc+frete);const pixDesc=method==='pix'&&s.pixDesconto?r2((sub-desc)*s.pixDesconto/100):0;
 return{items,sub,desc,frete,pixDesc,total:r2(base-pixDesc),coupon:c&&!cErr?c:null,cErr,count:items.reduce((a,i)=>a+i.qty,0)}
}
function parcelas(total){const s=ST();const out=[];for(let n=1;n<=(+s.parcelasMax||1);n++){if(n<=(+s.parcelasSemJuros||1))out.push({n,v:r2(total/n),tot:total,juros:false});else{const i=(+s.jurosMes||0)/100;const pm=i?total*i/(1-Math.pow(1+i,-n)):total/n;out.push({n,v:r2(pm),tot:r2(pm*n),juros:true})}}return out}

/* ===================== PIX (BR Code / EMV, padrão Bacen) ===================== */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
const ascii=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 @.\-_+]/g,'').toUpperCase();
function pixPayload({chave,nome,cidade,valor,txid}){const mai=tlv('00','br.gov.bcb.pix')+tlv('01',String(chave).trim());
 let p=tlv('00','01')+tlv('26',mai)+tlv('52','0000')+tlv('53','986')+(valor?tlv('54',(+valor).toFixed(2)):'')+tlv('58','BR')+tlv('59',ascii(nome).slice(0,25)||'LOJA')+tlv('60',ascii(cidade).slice(0,15)||'MACEIO')+tlv('62',tlv('05',(String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25))||'***'))+'6304';return p+crc16(p)}

/* ===================== RÁDIO ===================== */
const DIAS={dom:0,seg:1,ter:2,qua:3,qui:4,sex:5,sab:6};
function grade(){return ST().programacao.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.length>=4).map(([d,i,f,n,a])=>{let dias=[];if(d==='todos')dias=[0,1,2,3,4,5,6];else d.split(',').forEach(t=>{const[x,y]=t.split('-');if(y){for(let k=DIAS[x];k<=DIAS[y];k++)dias.push(k)}else if(DIAS[x]!=null)dias.push(DIAS[x])});return{dias,i,f,n,a:a||'',label:d}})}
function noAr(){const d=new Date();const hm=d.toTimeString().slice(0,5);return grade().find(g=>g.dias.includes(d.getDay())&&g.i<=hm&&hm<g.f)||{n:'Programação musical',a:'Farol FM'}}
function ytLive(){const s=ST();return s.aoVivo&&(s.ytVideoId||s.ytChannelId)}
function ytEmbedSrc(){const s=ST();return s.ytVideoId?`https://www.youtube.com/embed/${encodeURIComponent(s.ytVideoId)}?autoplay=1`:`https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(s.ytChannelId)}&autoplay=1`}
/* ---- RDS (música tocando agora) ---- */
S.np=null;
const tituloRDS=t=>String(t||'').trim().toLowerCase().replace(/(^|[\s\-–—(\/"'“.&])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function parseRDS(raw){raw=String(raw||'').replace(/\s+/g,' ').trim();if(!raw||/^(-|n\/a|unknown|desconhecido)$/i.test(raw))return null;const m=raw.split(/\s+[-–—]\s+/);return m.length>1?{artista:tituloRDS(m[0]),musica:tituloRDS(m.slice(1).join(' - ')),raw}:{artista:'',musica:tituloRDS(raw),raw}}
async function rdsPoll(){const s=ST();if(s.rdsAtivo===false)return;let np=null;
 try{if(CFG.API){const j=await api('GET','/api/nowplaying');if(j&&(j.musica||j.raw))np={artista:tituloRDS(j.artista),musica:tituloRDS(j.musica||j.raw),capa:j.capa||'',raw:j.raw}}
  else if(s.rdsUrl){const r=await fetch(s.rdsUrl,{cache:'no-store'});const tx=await r.text();let j=null;try{j=JSON.parse(tx)}catch(e){}
   const src=j&&j.icestats?[].concat(j.icestats.source||[])[0]:null;const raw=j?(src?(src.title&&src.artist?src.artist+' - '+src.title:src.title):(j.songtitle||j.title&&(j.artist?j.artist+' - '+j.title:j.title)||j.now_playing&&j.now_playing.song&&(j.now_playing.song.artist+' - '+j.now_playing.song.title)||'')):tx;np=parseRDS(raw)}}catch(e){}
 const mudou=JSON.stringify(np)!==JSON.stringify(S.np);S.np=np;if(mudou){renderPlayer();if(L()==='classico'&&curRoute!=='gestao')renderHeader(curRoute);mediaMeta()}}
setInterval(()=>{if(!document.hidden)rdsPoll()},20000);setTimeout(rdsPoll,1500);
function rdsTexto(){const n=S.np;return n&&n.musica?`${n.musica}${n.artista?' — '+n.artista:''}`:''}
function mediaMeta(){try{const n=S.np;navigator.mediaSession.metadata=new MediaMetadata({title:n&&n.musica?n.musica:ST().radioNome,artist:n&&n.artista?n.artista:noAr().n,album:ST().radioNome,artwork:[{src:n&&n.capa?n.capa:location.href.split('#')[0].replace(/[^/]*$/,'')+'assets/logo-farol-circulo.png',sizes:'512x512'}]})}catch(e){}}

function togglePlay(){const a=$('#aud');const s=ST();
 if(S.playing){a.pause();a.removeAttribute('src');a.load();S.playing=false;renderPlayer();renderHeader(curRoute);return}
 if(!s.streamUrl){toast('Configure a URL do streaming em Painel › Rádio');return}
 a.src=s.streamUrl;a.volume=LS.get('fr_vol',.9);a.play().then(()=>{S.playing=true;renderPlayer();renderHeader(curRoute);mediaMeta();rdsPoll()}).catch(()=>toast('Não foi possível tocar o streaming. Verifique a URL (precisa ser HTTPS).'))}
function watchLive(){const s=ST();if(!s.ytVideoId&&!s.ytChannelId){toast('Configure o canal do YouTube em Painel › Redes sociais');return}
 if(S.playing)togglePlay();
 openModal(`<div class="row" style="margin-bottom:12px"><span class="live-dot">AO VIVO</span><b>${esc(s.radioNome)} — ${esc(noAr().n)}</b></div><iframe class="yt" src="${ytEmbedSrc()}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><p class="small muted" style="margin:10px 0 0">Transmissão pelo canal ${esc(s.ytNome||'YouTube')} ${esc(s.ytHandle||'')}. ${s.aoVivo?'':'Se não houver live no momento, o YouTube mostra a próxima transmissão agendada. '}<a style="color:var(--pri);font-weight:700" href="${esc(s.youtube)}/live" target="_blank" rel="noopener">Abrir no YouTube</a> · <a style="color:#FF0000;font-weight:700" href="${ytSub()}" target="_blank" rel="noopener">Inscrever-se</a></p>`)}

 const pref=LS.get('fr_pmin',null);const mini=pref===null?s.radioBarra==='minimizada':!!+pref;const el=$('#player');el.classList.toggle('mini',mini);document.body.classList.toggle('player-mini',mini);
 // regra do RDS: capa da música quando houver; bola da logo só quando não houver imagem

 el.innerHTML=`<div class="wrap"><button class="pbtn" onclick="togglePlay()" aria-label="${S.playing?'Pausar':'Tocar'} a rádio">${ic(S.playing?'pause':'play')}</button>${art}

async function comEnviar(e,pid,pai){e.preventDefault();const f=e.target;const s=ST();if(f.site.value)return false;
 const nome=(S.me?S.me.nome:f.nome.value).trim().slice(0,60);const texto=f.texto.value.trim().slice(0,1000);
 if(nome.length<2){toast('Informe seu nome');return false}if(texto.length<3){toast('Escreva seu comentário');return false}
 if(!S.me)LS.set('fr_comnome',nome);const btn=f.querySelector('.com-env');btn.disabled=true;
 try{let c;if(CFG.API)c=await capi('POST','/api/comentarios',{postId:pid,pai:pai||null,nome,texto});
  else{let raiz=pai||null;const pp=S.data.comentarios.find(x=>x.id===pai);if(pp&&pp.pai)raiz=pp.pai;
   c={id:uid(),postId:pid,pai:raiz,nome,email:S.me?S.me.email:'',texto,data:new Date().toISOString(),curtidas:0,status:(s.comentariosModeracao==='previa'||comBad(texto))?'pendente':'aprovado'};S.data.comentarios.unshift(c);DB.persist('comentarios')}
  if(comSt(c)==='aprovado'&&!S.data.comentarios.some(x=>x.id===c.id))S.data.comentarios.unshift(c);
  const m=LS.get('fr_meuscom',[]);m.unshift(c);LS.set('fr_meuscom',m.slice(0,60));
  S.comResp=null;comRefresh(pid);toast(comSt(c)==='aprovado'?'Comentário publicado. Obrigado por participar! 🙏':'Comentário enviado! Ele aparece para todos depois da moderação.')}
 catch(err){toast(err.message);btn.disabled=false}return false}

function pgProduto(id){S.pv='';const p=S.data.produtos.find(x=>x.id===id);if(!p||!p.ativo)return pg404();const o=offPct(p);const pr=priceOf(p);const pc=parcelas(pr);const sj=pc.filter(x=>!x.juros).pop();
 return`<div class="wrap"><div class="prod-page"><div style="position:relative">${o>0?`<span class="off">-${o}%</span>`:''}<img src="${imgProd(p)}" alt=""></div><div><a class="chip" href="#loja">${esc(p.categoria)}</a><h1 style="font-size:30px;margin:8px 0">${esc(p.nome)}</h1><span class="small muted">SKU ${esc(p.sku||'-')} · ${+p.estoque>0?`${p.estoque} em estoque`:'<b style="color:var(--bad)">Esgotado</b>'}</span>

function pgCarrinho(){const t=totals();const s=ST();if(!t.items.length)return`<div class="wrap" style="text-align:center;padding:60px 0"><div style="font-size:60px">🛒</div><h2>Seu carrinho está vazio</h2><a class="btn" href="#loja">Ir para a loja</a></div>`;

 <div class="card widget" style="margin-top:16px"><h4>Cupom de desconto</h4><form class="row" onsubmit="applyCoupon(this.c.value);return false"><input name="c" value="${esc(S.coupon)}" placeholder="Ex.: BEMVINDO10" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surf)"><button class="btn">Aplicar</button>${S.coupon?`<button type="button" class="btn ghost" onclick="S.coupon='';LS.set('fr_coupon','');route()">Remover</button>`:''}</form>${t.cErr?`<p class="small" style="color:var(--bad);margin:8px 0 0">${esc(t.cErr)}</p>`:t.coupon?`<p class="small" style="color:var(--ok);margin:8px 0 0">✓ Cupom aplicado</p>`:''}</div>
 <div class="card widget" style="margin-top:16px"><h4>Entrega</h4><label class="fl ck"><input type="radio" name="sh" ${S.ship==='entrega'?'checked':''} onchange="S.ship='entrega';route()"> Entrega no endereço — ${t.sub>=s.freteGratisAcima?'grátis':brl(s.frete)} <span class="small muted">(grátis acima de ${brl(s.freteGratisAcima)})</span></label>${s.retirada?`<label class="fl ck"><input type="radio" name="sh" ${S.ship==='retirada'?'checked':''} onchange="S.ship='retirada';route()"> Retirar grátis — ${esc(s.enderecoRetirada)}</label>`:''}</div></div>
 ${sumBox(totals('cartao'),`${S.me?'':`<a class="small" href="#conta" onclick="S.afterLogin='checkout'" style="display:block;margin-top:12px;color:var(--pri);font-weight:700">💌 Entre ou crie sua conta para comprar mais rápido</a>`}<a class="btn" style="width:100%;justify-content:center;margin-top:14px" href="#checkout">Finalizar compra</a><p class="small pix-tag" style="text-align:center;margin:10px 0 0">${brl(totals('pix').total)} pagando no PIX</p>`)}</div></div>`}

function pgCheckout(){const t=totals();if(!t.items.length){location.hash='carrinho';return''}const cli={...LS.get('fr_cli',{}),...(S.me?{email:S.me.email,nome:LS.get('fr_cli',{}).nome||S.me.nome,tel:LS.get('fr_cli',{}).tel||S.me.tel||''}:{})};const s=ST();
 const pcs=parcelas(t.total);
 return`<div class="wrap"><div class="sec-title"><h2>Finalizar compra</h2></div><form id="ckf" class="two" style="margin-top:0" onsubmit="return doCheckout(event)"><div>
 <div class="card widget"><h4>1. Seus dados</h4><div class="form"><label class="fl w3">Nome completo<input name="nome" required value="${esc(cli.nome||'')}"></label><label class="fl w3">E-mail<input name="email" type="email" required value="${esc(cli.email||'')}"></label><label class="fl w3">WhatsApp<input name="tel" required value="${esc(cli.tel||'')}" placeholder="(82) 9...."></label><label class="fl w3">CPF<input name="cpf" required value="${esc(cli.cpf||'')}" inputmode="numeric" placeholder="000.000.000-00"></label></div></div>
 ${S.ship==='entrega'?`<div class="card widget" style="margin-top:16px"><h4>2. Endereço de entrega</h4><div class="form"><label class="fl w2">CEP<input name="cep" required value="${esc(cli.cep||'')}" onblur="buscaCep(this.value)"></label><label class="fl w4">Rua<input name="rua" required value="${esc(cli.rua||'')}"></label><label class="fl w2">Número<input name="num" required value="${esc(cli.num||'')}"></label><label class="fl w4">Complemento<input name="comp" value="${esc(cli.comp||'')}"></label><label class="fl w2">Bairro<input name="bairro" required value="${esc(cli.bairro||'')}"></label><label class="fl w2">Cidade<input name="cidade" required value="${esc(cli.cidade||'')}"></label><label class="fl w2">UF<input name="uf" required maxlength="2" value="${esc(cli.uf||'')}"></label></div></div>`:`<div class="card widget" style="margin-top:16px"><h4>2. Retirada</h4><p style="margin:0">${esc(s.enderecoRetirada)}</p></div>`}
 <div class="card widget" style="margin-top:16px"><h4>3. Pagamento</h4><div class="paytabs">${[['pix','pix','PIX'],['credito','card','Crédito'],['debito','card','Débito']].map(([k,i,n])=>`<button type="button" class="${S.pay===k?'on':''}" onclick="S.pay='${k}';saveCli();route()">${ic(i)}${n}</button>`).join('')}</div>
 ${S.pay==='pix'?`<div class="notice">Ao confirmar, geramos o QR Code e o código <b>PIX copia e cola</b>. ${s.pixDesconto?`Você ganha <b>${s.pixDesconto}% de desconto</b>.`:''}</div>`:
  (CFG.API&&s.mpPublicKey?`<div id="cardBrick"></div>`:`<div class="form"><label class="fl">Número do cartão<input name="cc" required inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" oninput="this.value=this.value.replace(/\\D/g,'').replace(/(\\d{4})(?=\\d)/g,'$1 ').slice(0,23)"></label><label class="fl">Nome impresso<input name="ccn" required autocomplete="cc-name"></label><label class="fl w3">Validade<input name="ccv" required placeholder="MM/AA" autocomplete="cc-exp" maxlength="5"></label><label class="fl w3">CVV<input name="cvv" required inputmode="numeric" maxlength="4" autocomplete="cc-csc"></label>
  ${S.pay==='credito'?`<label class="fl">Parcelas<select name="parc">${pcs.map(x=>`<option value="${x.n}">${x.n}x de ${brl(x.v)} ${x.juros?`(total ${brl(x.tot)})`:'sem juros'}</option>`).join('')}</select></label>`:''}</div><p class="small muted">🔒 Modo demonstração: nenhum valor é cobrado. Use 4111 1111 1111 1111 (aprovado) ou final 0002 (recusado). Em produção, os dados do cartão são tokenizados pelo Mercado Pago e nunca passam pelo seu servidor.</p>`)}
 </div></div>${sumBox(t,`<button class="btn" id="paybtn" style="width:100%;justify-content:center;margin-top:14px">${S.pay==='pix'?'Gerar PIX':'Pagar '+brl(t.total)}</button>`)}</form></div>`}
function saveCli(){const f=$('#ckf');if(!f)return;const o=LS.get('fr_cli',{});['nome','email','tel','cpf','cep','rua','num','comp','bairro','cidade','uf'].forEach(k=>{if(f[k])o[k]=f[k].value});LS.set('fr_cli',o)}
async function buscaCep(c){c=String(c).replace(/\D/g,'');if(c.length!==8)return;try{const r=await fetch(`https://viacep.com.br/ws/${c}/json/`);const j=await r.json();if(j.erro)return;const f=$('#ckf');f.rua.value=j.logradouro||'';f.bairro.value=j.bairro||'';f.cidade.value=j.localidade||'';f.uf.value=j.uf||'';f.num.focus()}catch(e){}}
const luhn=n=>{let s=0,a=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(a){d*=2;if(d>9)d-=9}s+=d;a=!a}return s%10===0};
const bandeira=n=>/^4/.test(n)?'Visa':/^(5[1-5]|2[2-7])/.test(n)?'Mastercard':/^3[47]/.test(n)?'Amex':/^(4011|4312|4389|4514|4576|5041|5066|5067|509|6277|6362|6363|650|6516|6550)/.test(n)?'Elo':/^(606282|3841)/.test(n)?'Hipercard':'Cartão';
function validCPF(c){c=String(c).replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=c[i]*(10-i);let d=(s*10)%11%10;if(d!=c[9])return false;s=0;for(let i=0;i<10;i++)s+=c[i]*(11-i);return(s*10)%11%10==c[10]}
function buildOrder(f,t){const cli={};['nome','email','tel','cpf','cep','rua','num','comp','bairro','cidade','uf'].forEach(k=>{if(f[k])cli[k]=f[k].value.trim()});
 return{id:'FF'+Date.now().toString().slice(-8),data:new Date().toISOString(),cliente:cli,entrega:S.ship,itens:t.items.map(i=>({id:i.p.id,nome:i.p.nome+(i.v?' ('+i.v+')':''),v:i.v,qty:i.qty,unit:i.unit,line:i.line})),subtotal:t.sub,desconto:t.desc,cupom:t.coupon?t.coupon.codigo:'',frete:t.frete,descontoPix:t.pixDesc,total:t.total,metodo:S.pay,status:'aguardando',historico:[{d:new Date().toISOString(),s:'Pedido criado'}]}}
async function doCheckout(e){e.preventDefault();const f=e.target;saveCli();if(!validCPF(f.cpf.value)){toast('CPF inválido');f.cpf.focus();return false}
 const t=totals();for(const i of t.items)if(i.qty>+i.p.estoque){toast(`Estoque insuficiente: ${i.p.nome}`);return false}
 const btn=$('#paybtn');btn.disabled=true;btn.textContent='Processando...';
 try{
  if(CFG.API){const payload={itens:S.cart,cupom:t.coupon?t.coupon.codigo:'',entrega:S.ship,metodo:S.pay,cliente:buildOrder(f,t).cliente};
   if(S.pay==='pix'){const o=await api('POST','/api/checkout',payload);finishOrder(o);return false}
   toast('Preencha os dados do cartão no formulário seguro');btn.disabled=false;return false}
  const o=buildOrder(f,t);
  if(S.pay==='pix'){o.pix=pixPayload({chave:ST().pixChave||'demo@farolradiotv.com.br',nome:ST().pixNome,cidade:ST().pixCidade,valor:o.total,txid:o.id});o.historico.push({d:o.data,s:'PIX gerado'})}
  else{const n=f.cc.value.replace(/\D/g,'');const[mm,aa]=f.ccv.value.split('/');
   if(n.length<13||!luhn(n)){throw new Error('Número de cartão inválido')}
   if(!(+mm>=1&&+mm<=12)||!aa||new Date(2000+ +aa,+mm)<new Date())throw new Error('Validade inválida');
   if(!/^\d{3,4}$/.test(f.cvv.value))throw new Error('CVV inválido');
   o.cartao={bandeira:bandeira(n),final:n.slice(-4),parcelas:S.pay==='credito'?+f.parc.value:1};
   if(o.cartao.parcelas>1){const pp=parcelas(o.total).find(x=>x.n===o.cartao.parcelas);o.totalCobrado=pp.tot}
   await new Promise(r=>setTimeout(r,900));
   if(n.endsWith('0002')){o.status='recusado';o.historico.push({d:new Date().toISOString(),s:'Pagamento recusado pela operadora'})}else markPaid(o,`Pagamento aprovado — ${o.cartao.bandeira} final ${o.cartao.final}`)}
  S.data.pedidos.unshift(o);DB.persist('pedidos');finishOrder(o)
 }catch(err){toast(err.message);btn.disabled=false;btn.textContent='Tentar novamente'}return false}
function markPaid(o,msg){o.status='pago';o.pagoEm=new Date().toISOString();o.historico.push({d:o.pagoEm,s:msg||'Pagamento confirmado'});
 o.itens.forEach(i=>{const p=S.data.produtos.find(x=>x.id===i.id);if(p)p.estoque=Math.max(0,+p.estoque-i.qty)});DB.persist('produtos');

 if(CFG.API)fetch(CFG.API+`/api/ads/${a.id}/${ev}`,{method:'POST',keepalive:true}).catch(()=>{});else{clearTimeout(S.adT);S.adT=setTimeout(()=>DB.persist('anuncios'),800)}}
function renderAdMob(){let el=$('#admob');const show=ST().adMobile&&!adOff('mobile')&&curRoute!=='gestao'&&!curRoute.startsWith('post-')&&!S.adMobClosed&&adAtivos('mobile').length;document.body.classList.toggle('has-admob',!!show&&innerWidth<=640);
 if(!show){if(el)el.remove();return}if(!el){el=document.createElement('div');el.id='admob';document.body.appendChild(el)}
 el.innerHTML=adSlot('mobile').replace('class="ad ad-mobile"','class="ad ad-mob ad-mobile"').replace('<span class="ad-l">Publicidade</span>','<span class="ad-l">Publicidade</span><button class="ad-x" aria-label="Fechar anúncio" onclick="S.adMobClosed=true;renderAdMob()">×</button>')}
